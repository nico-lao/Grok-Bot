<script>
const SEGMENTS = [{"id": 1, "start": 10.72, "end": 17.73, "en": "Okay, let's see. My 115 IQ. Why do some groups lie about their IQ?", "zh": "好，我們來看看。我智商 115。為什麼有些群體會在智商上說謊？", "tags": [{"k": "phrase", "v": "Okay, let's see.", "native": "used when starting to look at something together", "nativeZh": "一起開始看／檢視某事時用", "examples": ["Okay, let's see what the options are.", "Okay, let's see if this works."], "usage": "口語開場：先停一下、一起看狀況，會議或教學都很常用。"}, {"k": "phrase", "v": "Why do some groups…?", "native": "used when questioning a puzzling pattern", "nativeZh": "對某個奇怪現象提出疑問", "examples": ["Why do some people quit right before they succeed?", "Why do some teams keep making the same mistake?"], "usage": "用 Why do some… 提問某個群體／類型的行為模式，比直接指責更中性。"}], "notes": []}, {"id": 2, "start": 17.8, "end": 26.69, "en": "IQ is the most consistently reliable predictor for success that we have. So much so that if we go simply by financial success at the end of life, it", "zh": "智商是我們目前最穩定、最可靠的成功預測指標。甚至到這種程度：如果只看人生後期的財務成就，", "tags": [{"k": "vocab", "v": "predictor", "native": "a factor that forecasts an outcome", "nativeZh": "預測指標／能預示結果的因素", "examples": ["Sleep is a strong predictor of mood the next day.", "Attendance is a predictor of final grades."], "usage": "正式一點的詞，簡報、報告常用：A is a predictor of B。"}, {"k": "phrase", "v": "So much so that…", "native": "used to intensify a claim with a result", "nativeZh": "強調「甚至到……的程度」", "examples": ["He loves coffee, so much so that he drinks five cups a day.", "The app is popular, so much so that servers keep crashing."], "usage": "接在一個說法後面，加強語氣並帶出結果，比 very 更有「程度之深」。"}], "notes": []}, {"id": 3, "start": 26.2, "end": 32.01, "en": "is better to be born poor with gifted IQ than born rich with mediocre IQ.", "zh": "寧可生來貧窮但智商資優，也好過生來有錢但智商平庸。", "tags": [{"k": "vocab", "v": "gifted", "native": "unusually talented (often academic)", "nativeZh": "資優的、天賦很高的", "examples": ["She's in a gifted program at school.", "He is gifted at languages."], "usage": "談天賦／資優教育常用；也可說 a gifted student。"}, {"k": "vocab", "v": "mediocre", "native": "only average; not very good", "nativeZh": "平庸的、普通偏弱的", "examples": ["The food was mediocre.", "I don't want a mediocre result—I want it done well."], "usage": "帶一點負評的「普通」，工作與產品評價很常見。"}], "notes": []}, {"id": 4, "start": 32.119, "end": 37.32, "en": "And that predicts more than just money, including impulse control, charisma, among others.", "zh": "而且它預測的不只是錢，還包括自制力、個人魅力等等。", "tags": [{"k": "phrase", "v": "among others", "native": "and more items not listed", "nativeZh": "以及其他（沒全部列完）", "examples": ["She speaks French and Japanese, among others.", "Stress can hurt sleep and focus, among others."], "usage": "列舉後收尾，表示還有別的，正式口語都好用。"}, {"k": "vocab", "v": "impulse control", "native": "ability to resist sudden urges", "nativeZh": "自制力、衝動控制", "examples": ["Kids need to practice impulse control.", "Better impulse control helps with spending."], "usage": "心理／日常自律話題常用搭配。"}], "notes": []}, {"id": 5, "start": 37.28, "end": 49.05, "en": "The stereotype of the socially awkward nerd as being the ones of high IQ is mostly a fiction. In reality, nerds aren't necessarily smarter, just more obsessively studious. Whereas those of", "zh": "那種「高智商的人都是社交障礙書呆子」的刻板印象，多半是假的。實際上書呆子不一定更聰明，只是更偏執地用功。而那些", "tags": [{"k": "vocab", "v": "stereotype", "native": "oversimplified belief about a group", "nativeZh": "刻板印象", "examples": ["That's just a stereotype.", "Try not to judge people by stereotypes."], "usage": "討論偏見、形象時的核心詞。"}, {"k": "phrase", "v": "In reality,…", "native": "used to contrast myth vs fact", "nativeZh": "實際上／事實上（用來糾正）", "examples": ["In reality, the job is mostly email.", "They look rich; in reality, they're in debt."], "usage": "先講常見看法，再用 In reality 翻轉，解說很常用。"}], "notes": []}, {"id": 6, "start": 48.52, "end": 54.93, "en": "genuinely higher IQs, even if they are not naturally charismatic, can learn how to improve their communication easily.", "zh": "真正智商更高的人，就算天生不那麼會交際，也能輕易學會改善溝通。", "tags": [{"k": "phrase", "v": "even if…", "native": "used for a concession", "nativeZh": "即使……也……", "examples": ["Even if it's hard, I'll try.", "Even if you're busy, send a short reply."], "usage": "讓步句型，日常與辯論都高頻。"}, {"k": "phrase", "v": "learn how to…", "native": "acquire a skill", "nativeZh": "學會如何……", "examples": ["I need to learn how to say no.", "She learned how to manage her time."], "usage": "比 learn to 更強調「方法／步驟」。"}], "notes": []}, {"id": 7, "start": 54.8, "end": 63.96, "en": "That's right. That's right. You just act that way, figure out what people want to hear, and then you just tell them what they want to hear. That's it. It's so simple.", "zh": "對，沒錯。你只要那樣表現，搞清楚別人想聽什麼，然後照著講就好。就這樣，超簡單。", "tags": [{"k": "phrase", "v": "figure out", "native": "understand / work out a solution", "nativeZh": "搞懂、想出辦法", "examples": ["Can you figure out what went wrong?", "I finally figured out the subway."], "usage": "超常用口語動詞片語，工作與生活都適用。"}, {"k": "phrase", "v": "That's it. It's so simple.", "native": "used to sum up something as easy", "nativeZh": "就這樣，超簡單", "examples": ["Add water, stir—that's it. It's so simple.", "Save the file and send it. That's it."], "usage": "收束說明、強調並不複雜時很好用。"}], "notes": []}, {"id": 8, "start": 63.32, "end": 68.2, "en": "This is intuitive, as IQ tests are just puzzles being solved with minimal information.", "zh": "這很直覺，因為智商測驗本質上就是用很少資訊去解的謎題。", "tags": [{"k": "vocab", "v": "intuitive", "native": "easy to understand without much thinking", "nativeZh": "直覺的、好懂的", "examples": ["The app is really intuitive.", "Her answer felt intuitive, but we still checked the data."], "usage": "產品體驗、說明設計時高頻；也可說 This is intuitive."}], "notes": []}, {"id": 9, "start": 67.96, "end": 76.24, "en": "And IQ scores measure how well you did to other test-takers. Thus, having a higher IQ means you're better at problem-solving than someone with a lower score.", "zh": "而智商分數衡量的是你相對其他考生表現得有多好。因此，分數更高代表你比分數低的人更擅長解決問題。", "tags": [{"k": "phrase", "v": "Thus,…", "native": "formal 'so / therefore'", "nativeZh": "因此（稍正式）", "examples": ["Thus, we decided to postpone the launch.", "The sample is biased; thus, the result is weak."], "usage": "寫作、簡報承接結論常用；口語多用 so。"}, {"k": "vocab", "v": "problem-solving", "native": "skill of finding solutions", "nativeZh": "解決問題（的能力）", "examples": ["This role needs strong problem-solving skills.", "Games can train problem-solving."], "usage": "履歷與面試超常見複合詞。"}], "notes": []}, {"id": 10, "start": 75.8, "end": 86.09, "en": "Wow. Unfortunately, IQ has become interwoven with ego in recent decades. Having a score that straight-up tells you if you're smarter or stupider than people will naturally lend itself to pride.", "zh": "哇。可惜近幾十年智商跟自尊心綁得很緊。有一個分數直接告訴你比別人聰明還是笨，自然很容易滋長驕傲。", "tags": [{"k": "vocab", "v": "interwoven with", "native": "closely mixed / tied together", "nativeZh": "與……緊密交織", "examples": ["Work is interwoven with her identity.", "The plot is interwoven with real history."], "usage": "偏書面，形容兩者分不開。"}, {"k": "phrase", "v": "straight-up", "native": "directly; bluntly / simply", "nativeZh": "直接了當、毫不拐彎", "examples": ["I'll be straight-up with you: this won't work.", "That movie is straight-up boring."], "usage": "美式口語，可當副詞強調「就是／直接」。"}, {"k": "phrase", "v": "lend itself to", "native": "be likely to produce / invite something", "nativeZh": "容易導致／適合……", "examples": ["Open plans lend themselves to distraction.", "This topic lends itself to debate."], "usage": "稍正式，說明某情況天然容易產生某種結果。"}], "notes": []}, {"id": 11, "start": 85.96, "end": 94.61, "en": "That's A lot of people think that having a high a high IQ means that they are Like I I think intelligence can be measured in like", "zh": "很多人覺得高智商就代表他們很……我覺得智力其實可以用大概", "tags": [{"k": "phrase", "v": "A lot of people think…", "native": "introducing a common belief", "nativeZh": "很多人覺得……", "examples": ["A lot of people think remote work is easier—it isn't always.", "A lot of people think fluency means zero accent."], "usage": "提出常見看法後再同意或反駁，討論開場很自然。"}], "notes": []}, {"id": 12, "start": 94.28, "end": 102.69, "en": "five or six different ways, right? Cuz there's a lot of different ways that somebody can be smart, but people put a lot of a lot of attention on IQ.", "zh": "五六種不同方式衡量，對吧？因為人可以「聰明」的面向很多，但大家把太多注意力放在智商上。", "tags": [{"k": "phrase", "v": "Cuz / Because there's a lot of different ways…", "native": "explaining variety", "nativeZh": "因為有很多不同方式……", "examples": ["There's a lot of different ways to learn English.", "There's a lot of different ways to solve this."], "usage": "口語解釋「不是只有一種做法」時常用。"}, {"k": "phrase", "v": "put a lot of attention on…", "native": "focus heavily on", "nativeZh": "把很多注意力放在……", "examples": ["Don't put all your attention on the score.", "The media puts a lot of attention on drama."], "usage": "也可說 pay a lot of attention to…，更常見一點。"}], "notes": []}, {"id": 13, "start": 102.6, "end": 107.84, "en": "The only distinction between a human and an animal is intelligence. Uh-huh.", "zh": "人和動物唯一的差別就是智力。嗯哼。", "tags": [], "notes": []}, {"id": 14, "start": 106.92, "end": 112.09, "en": "Whereas a religious society would argue the uniqueness of human beings stem from being made in the image of God.", "zh": "而宗教社會會主張：人類的獨特來自於按上帝形象所造。", "tags": [{"k": "phrase", "v": "Whereas…", "native": "contrast two situations", "nativeZh": "然而／相對地……", "examples": ["I prefer tea, whereas she prefers coffee.", "Whereas the first plan was cheap, this one is safer."], "usage": "對比句連接詞，寫作與口說論點都很實用。"}], "notes": []}, {"id": 15, "start": 112.8, "end": 123.062, "en": "society relies on intelligence as the sole differentiator. And the logical conclusion of that is the more intelligent, the more human. The consequence is the incredible insecurity", "zh": "社會把智力當成唯一的區分標準。照這個邏輯推下去：越聰明就越像「人」。後果就是巨大的不安全感——", "tags": [{"k": "vocab", "v": "logical conclusion", "native": "result that follows from reasoning", "nativeZh": "邏輯上的結論", "examples": ["The logical conclusion is that we need more data.", "Taken to its logical conclusion, the rule becomes silly."], "usage": "討論推理、政策後果時常用。"}, {"k": "vocab", "v": "insecurity", "native": "lack of confidence / feeling unsafe about oneself", "nativeZh": "不安全感、不自信", "examples": ["His jokes come from insecurity.", "Money stress creates insecurity."], "usage": "談情緒與自我評價的日常詞。"}], "notes": []}, {"id": 16, "start": 123.012, "end": 133.582, "en": "most people exhibit regarding their perceived intelligence. This is obvious when you look at people's stances on IQ tests themselves. In general, the more mediocre someone's score is, the more", "zh": "多數人對自己「被認定的智力」都很敏感。看大家對智商測驗的態度就很明顯。一般來說，分數越普通，就越", "tags": [{"k": "phrase", "v": "This is obvious when…", "native": "pointing to clear evidence", "nativeZh": "當……時這一點就很明顯", "examples": ["This is obvious when you compare the two charts.", "This is obvious when kids get hungry."], "usage": "帶聽者去看證據，解說語氣自然。"}, {"k": "vocab", "v": "mediocre", "native": "ordinary; not impressive", "nativeZh": "平庸的", "examples": ["A mediocre score still gets you in.", "Don't settle for mediocre service."]}], "notes": []}, {"id": 17, "start": 133.132, "end": 138.782, "en": "likely they are to ignore IQ's objectively true predictive power and find excuses to ignore it.", "zh": "容易否認智商客觀上的預測力，並找各種藉口忽視它。", "tags": [{"k": "phrase", "v": "find excuses to…", "native": "invent reasons to avoid something", "nativeZh": "找藉口去……", "examples": ["He always finds excuses to skip the gym.", "Don't find excuses to delay the hard talk."], "usage": "批評拖延或逃避時很口語。"}], "notes": []}, {"id": 18, "start": 138.612, "end": 146.662, "en": "I think this is absolutely true. People that think IQ doesn't matter, it obviously matters. It's not the only thing that matters and people can be", "zh": "我覺得這完全說得對。覺得智商不重要的人——它顯然重要。它不是唯一重要的事，人也可以在", "tags": [{"k": "phrase", "v": "I think this is absolutely true.", "native": "strong agreement", "nativeZh": "我覺得這完全正確", "examples": ["I think that's absolutely true for startups.", "Absolutely true—timing matters."], "usage": "同意對方並加重語氣；也可單說 Absolutely."}, {"k": "phrase", "v": "It's not the only thing that matters.", "native": "softening a strong claim", "nativeZh": "那不是唯一重要的事", "examples": ["Money matters, but it's not the only thing that matters.", "Grades matter—they're not the only thing that matters."], "usage": "先承認重要性，再避免絕對化，討論很成熟。"}], "notes": []}, {"id": 19, "start": 146.132, "end": 156.372, "en": "good to other things that aren't just simply having high intelligence. But like on a very very basic level, uh yeah, it matters a lot. It absolutely does.", "zh": "其他方面很優秀，不只靠高智力。但就最基本的層面來說，對，它很重要，絕對重要。", "tags": [{"k": "phrase", "v": "on a very basic level", "native": "at the simplest / fundamental level", "nativeZh": "就最基本的層面來說", "examples": ["On a very basic level, you need sleep.", "On a basic level, the app should just load."], "usage": "把討論拉回基本面，會議與教學常用。"}, {"k": "phrase", "v": "It absolutely does.", "native": "emphatic confirmation", "nativeZh": "絕對是／絕對會", "examples": ["Does practice help? It absolutely does.", "Does tone matter in email? It absolutely does."], "usage": "短句加重肯定，回應對方疑問時很有力。"}], "notes": []}, {"id": 20, "start": 155.932, "end": 166.102, "en": "I've already done several videos on group IQ disparities focusing on groups that score low. Pride makes those groups less able to accept reality and instead lie, often appealing to socioeconomic", "zh": "我已經做過好幾支講群體智商差異、聚焦低分群體的影片。驕傲會讓那些群體更難接受現實，反而說謊，常常搬出社經", "tags": [{"k": "vocab", "v": "disparities", "native": "gaps / inequalities", "nativeZh": "差距、不平等", "examples": ["There are huge pay disparities.", "Health disparities between cities are growing."], "usage": "新聞與正式討論常用複數。"}], "notes": []}, {"id": 21, "start": 166.212, "end": 171.212, "en": "factors or other environmental circumstances to mask their innate failings.", "zh": "因素或其他環境條件，來掩蓋天生的不足。", "tags": [{"k": "phrase", "v": "mask (something)", "native": "hide / cover up", "nativeZh": "掩蓋、掩飾", "examples": ["Jokes can mask nervousness.", "Busywork masks the real problem."], "usage": "動詞用法：mask + 名詞，談情緒或問題時好用。"}], "notes": []}, {"id": 22, "start": 170.652, "end": 178.102, "en": "The 83 as well. Like I It's really funny because this guy does a lot of One of my favorite things about these videos is", "zh": "八十三也一樣。我覺得很好笑，因為這個人做很多……我最喜歡這類影片的一點是：", "tags": [], "notes": []}, {"id": 23, "start": 177.652, "end": 187.742, "en": "that these videos are There is a lot of like hidden information and hidden messaging here that a lot of people probably don't even notice. And that's", "zh": "這些影片裡有很多隱藏資訊、隱藏訊息，很多人可能根本沒注意到。而那正是", "tags": [{"k": "vocab", "v": "hidden messaging", "native": "indirect / implied message", "nativeZh": "隱藏訊息、潛台詞", "examples": ["Ads often use hidden messaging.", "I caught the hidden messaging in that speech."], "usage": "媒體識讀話題常用。"}, {"k": "phrase", "v": "don't even notice", "native": "fail to realize", "nativeZh": "根本沒注意到", "examples": ["Most people don't even notice the fee.", "I didn't even notice the typo."], "usage": "強調「連察覺都沒有」，口語很自然。"}], "notes": []}, {"id": 24, "start": 187.332, "end": 194.342, "en": "what I like so much about it. Groups that score well can also fall victim to pride. After all, who doesn't want to be the best? Therefore, the", "zh": "我這麼喜歡它的原因。表現好的群體也可能成為驕傲的受害者。畢竟，誰不想當第一？因此，那些", "tags": [{"k": "phrase", "v": "fall victim to…", "native": "be harmed by / become a victim of", "nativeZh": "成為……的受害者／中招", "examples": ["Don't fall victim to scams.", "Even smart people fall victim to pride."], "usage": "稍正式，新聞與提醒都很常見。"}, {"k": "phrase", "v": "After all,…", "native": "reminding of a basic reason", "nativeZh": "畢竟……", "examples": ["After all, we're only human.", "Take a break—after all, you've been working all day."], "usage": "補充理所當然的理由，語氣軟。"}], "notes": []}, {"id": 25, "start": 193.772, "end": 203.542, "en": "insecure groups, even the ones that perform, may still lie to appear even smarter. Uncovering those lies will be the topic of today's video. And if you enjoyed, consider subscribing. It helps", "zh": "不安的群體——就算表現不錯——仍可能說謊，好讓自己看起來更聰明。揭穿這些謊言就是今天影片的主題。喜歡的話記得訂閱，對頻道有幫助。", "tags": [{"k": "phrase", "v": "appear even smarter", "native": "seem more intelligent than before", "nativeZh": "顯得更聰明", "examples": ["He name-drops to appear smarter.", "Don't fake jargon just to appear smarter."], "usage": "appear + 形容詞：外表看起來……"}, {"k": "phrase", "v": "if you enjoyed, consider subscribing", "native": "soft CTA for creators", "nativeZh": "喜歡的話可以考慮訂閱", "examples": ["If you found this useful, consider sharing it.", "If you enjoyed the episode, consider leaving a review."], "usage": "溫和號召行動句型：If you…, consider…"}], "notes": []}, {"id": 26, "start": 203.092, "end": 214.262, "en": "the channel. But we'll be doing so with tact. IQ is already a touchy subject, especially when we factor in disparities between identity groups. So when illustrating my points, instead of", "zh": "不過我們會比較委婉地講。智商本來就敏感，尤其再把身份群體差異加進來。所以說明論點時，我不會", "tags": [{"k": "phrase", "v": "with tact", "native": "in a careful, polite way", "nativeZh": "有分寸地、委婉地", "examples": ["Tell him the bad news with tact.", "She handled the complaint with tact."], "usage": "職場回饋、敏感話題必備。"}, {"k": "vocab", "v": "touchy subject", "native": "sensitive topic that upsets people", "nativeZh": "敏感話題", "examples": ["Politics can be a touchy subject at dinner.", "Salary is a touchy subject here."], "usage": "提醒別人小心切入時常用。"}], "notes": []}, {"id": 27, "start": 213.732, "end": 224.262, "en": "naming the actual groups, I'll stick to hypothetical identities. And if you notice any real-life parallels, that's you projecting your own preconceived notions. Actually, think about it. It", "zh": "直接點名真實群體，而是用假設的身份。如果你聯想到現實對應，那是你自己在投射先入為主的想法。仔細想想——", "tags": [{"k": "vocab", "v": "hypothetical", "native": "imagined for discussion; not real", "nativeZh": "假設的", "examples": ["Let's use a hypothetical example.", "This is a hypothetical question."]}, {"k": "vocab", "v": "preconceived notions", "native": "opinions formed before knowing facts", "nativeZh": "先入為主的觀念", "examples": ["Try to drop your preconceived notions.", "The data challenged my preconceived notions."], "usage": "批判思考高頻搭配。"}], "notes": []}, {"id": 28, "start": 223.652, "end": 232.702, "en": "actually makes you the racist. The three groups with the highest IQs in this fictional world are the West Circles who originate around here, the East Triangles who originate around here,", "zh": "這樣反而變成你才是種族歧視的那個。在這個虛構世界裡，智商最高的三個群體是：西邊的圓形（起源在這）、東邊的三角形（起源在這），", "tags": [{"k": "phrase", "v": "stick to…", "native": "keep using / not switch away from", "nativeZh": "堅持用／固守……", "examples": ["Please stick to the agenda.", "I'll stick to the facts."], "usage": "會議與自律都很常用。"}], "notes": []}, {"id": 29, "start": 232.532, "end": 235.382, "en": "It's just upside down. It's just upside", "zh": "只是地圖上下顛倒了而已。", "tags": [], "notes": []}, {"id": 30, "start": 239.812, "end": 247.774, "en": "Oh boy. and the Circle Stars who are actually a mix of the Circle population and the Star population that originated here and here Uh-huh.", "zh": "喔天啊。還有圓星族——其實是圓形族群和星星族群的混血，起源在這裡跟這裡。嗯哼。", "tags": [], "notes": []}, {"id": 31, "start": 246.814, "end": 252.304, "en": "and became insular. Of these three, the Circle Stars claim the highest average IQ of 115.", "zh": "後來變得很封閉。這三者之中，圓星族自稱平均智商最高，達 115。", "tags": [{"k": "vocab", "v": "insular", "native": "isolated; inward-looking", "nativeZh": "封閉的、與外界隔絕的", "examples": ["The village felt insular.", "An insular team ignores outside feedback."], "usage": "形容社群或團隊不開放。"}, {"k": "phrase", "v": "claim the highest…", "native": "say they have the top amount", "nativeZh": "宣稱擁有最高的……", "examples": ["They claim the highest satisfaction rate.", "The brand claims the highest quality."], "usage": "claim 常帶「宣稱但未必已被證實」的語感。"}], "notes": []}, {"id": 32, "start": 253.574, "end": 259.864, "en": "They are very, very high-level. They're so high-level that some people think they control the entire world.", "zh": "他們層級非常非常高。高到有人覺得他們在掌控整個世界。", "tags": [{"k": "phrase", "v": "They're so… that…", "native": "result of extreme degree", "nativeZh": "他們太……以至於……", "examples": ["They're so busy that they skip lunch.", "The UI is so simple that kids can use it."], "usage": "程度＋結果句型，口說寫作都高頻。"}], "notes": []}, {"id": 33, "start": 259.774, "end": 265.544, "en": "dwarfing the scores of the West Circles and East Triangles Uh-huh. by nearly an entire standard deviation.", "zh": "幾乎高出西邊圓形和東邊三角形整整一個標準差。", "tags": [{"k": "vocab", "v": "dwarfing", "native": "making something look small by comparison", "nativeZh": "使……相形見絀", "examples": ["The new tower is dwarfing the old shops.", "His salary is dwarfing mine."], "usage": "生動動詞，比較差距時很好用。"}], "notes": []}, {"id": 34, "start": 265.894, "end": 271.224, "en": "A point of great pride for them. Except for the fact that it's entirely a result of manipulating statistics.", "zh": "這是他們很大的驕傲點。只不過，這完全是操弄統計的結果。", "tags": [{"k": "phrase", "v": "Except for the fact that…", "native": "introducing a major catch", "nativeZh": "只不過有個事實是……", "examples": ["It's a great plan, except for the fact that we have no budget.", "I agree—except for the fact that the data is old."], "usage": "先肯定再丟關鍵但書，談判與吐槽都好用。"}, {"k": "vocab", "v": "manipulating statistics", "native": "twisting numbers to mislead", "nativeZh": "操弄統計數字", "examples": ["Be careful—some charts manipulate statistics.", "They're manipulating statistics to look better."]}], "notes": []}, {"id": 35, "start": 271.494, "end": 279.824, "en": "Studies were done comparing the predicted IQs of Circle Star Stop talking. children in private kindergartens for Star people and compared against the general populace's children.", "zh": "有研究拿圓星族——別再說了——在給星星族群上的私立幼稚園小孩的預測智商，去跟一般大眾的小孩比。", "tags": [], "notes": []}, {"id": 36, "start": 279.654, "end": 288.344, "en": "Uh-huh. The lack of controls in these studies were staggering. And even they had to concede that as the children age, their IQ drops towards the population average.", "zh": "嗯哼。這些研究缺乏對照組的程度驚人。連他們自己也不得不承認：隨著孩子長大，智商會往人口平均靠攏。", "tags": [{"k": "vocab", "v": "lack of controls", "native": "missing comparison conditions in a study", "nativeZh": "缺乏對照／控制變因", "examples": ["The study has a serious lack of controls.", "Without controls, the result is weak."], "usage": "讀研究、聽科普時實用。"}, {"k": "phrase", "v": "had to concede that…", "native": "be forced to admit", "nativeZh": "不得不承認……", "examples": ["He finally had to concede that he was wrong.", "Even fans had to concede that the ending was weak."], "usage": "concede＝承認對方有理，語氣比 admit 更「不情願」。"}], "notes": []}, {"id": 37, "start": 288.254, "end": 297.104, "en": "Never been IQ-tested. I have never been IQ-tested, ever. I I've never even looked at it or even like My my my opinion is that I don't think that I", "zh": "我從來沒測過智商。真的從來沒測過。我甚至沒認真看過。我的看法是：我不覺得自己", "tags": [{"k": "phrase", "v": "I have never been…", "native": "lifetime experience (present perfect)", "nativeZh": "我從來沒……過", "examples": ["I have never been skydiving.", "I've never been good at small talk."], "usage": "談人生經驗用現在完成式，超常用。"}], "notes": []}, {"id": 38, "start": 296.534, "end": 306.464, "en": "have a very, very high IQ. I just think that I'm extremely manipulative and I have an incredibly good memory that people perceive as intelligence. And", "zh": "智商特別高。我只是覺得自己很會操弄局面，而且記性好到被別人當成聰明。而且", "tags": [{"k": "phrase", "v": "people perceive as…", "native": "others see it as", "nativeZh": "被別人視為……", "examples": ["Calmness can be perceived as confidence.", "Silence is sometimes perceived as agreement."], "usage": "談印象與誤解時好用；也可说 perceive X as Y。"}], "notes": []}, {"id": 39, "start": 305.934, "end": 310.534, "en": "because I can remember a lot of things, people think that I'm a lot smarter than I am.", "zh": "因為我記得很多事，別人就覺得我比實際聰明很多。", "tags": [{"k": "phrase", "v": "people think that I'm… than I am", "native": "others over/under-estimate you", "nativeZh": "別人以為我比實際更……", "examples": ["People think I'm taller than I am.", "People think I'm stricter than I am."], "usage": "澄清外界印象的口語句型。"}], "notes": []}, {"id": 40, "start": 309.894, "end": 315.344, "en": "To discover the true IQ of Circle Stars, all we have to do is visit their fictional country of Yahustan.", "zh": "要找出圓星族真正的智商，我們只要去他們虛構的國家「Yahustan」就行。", "tags": [], "notes": []}, {"id": 41, "start": 319.854, "end": 325.254, "en": "I've never heard of this place before. with an official average IQ of 94. 94.", "zh": "這地方我從沒聽過。官方平均智商是 94。九十四。", "tags": [{"k": "phrase", "v": "I've never heard of…", "native": "expressing unfamiliarity", "nativeZh": "我從沒聽過……", "examples": ["I've never heard of that brand.", "I've never heard of this rule before."], "usage": "禮貌表示陌生，學習與會議都常用。"}], "notes": []}, {"id": 42, "start": 324.494, "end": 331.224, "en": "Now, Circle Stars aren't the only identity group in Yahustan. They are in fact only about 33.6% of the population.", "zh": "圓星族並不是 Yahustan 唯一的身份群體。事實上他們大約只佔人口 33.6%。", "tags": [{"k": "phrase", "v": "in fact", "native": "adding a stronger / corrective detail", "nativeZh": "事實上／其實", "examples": ["He looks shy; in fact, he's the team lead.", "It's not rare—in fact, it's common."], "usage": "補充或修正前一句，語氣自然。"}], "notes": []}, {"id": 43, "start": 331.454, "end": 336.494, "en": "However, we actually know the IQ scores of the remaining population as you're seeing on screen.", "zh": "不過其餘人口的智商分數我們其實都知道，就如螢幕上所見。", "tags": [], "notes": []}, {"id": 44, "start": 336.534, "end": 342.654, "en": "Meaning we can simply calculate the Circle Star IQ with a maximum of 103, not 115.", "zh": "所以我們可以直接算出圓星族智商最多大約 103，不是 115。", "tags": [{"k": "phrase", "v": "Meaning we can…", "native": "spelling out the implication", "nativeZh": "這意味著我們可以……", "examples": ["Everyone agreed. Meaning we can start tomorrow.", "The store is closed. Meaning we'll come back later."], "usage": "口語承接推論；正式一點可用 Which means…"}], "notes": []}, {"id": 45, "start": 343.414, "end": 351.784, "en": "I say maximum because the IQ score used for the Sand Stars is actually the lowest estimate, most generous situation for Circle Star IQ.", "zh": "我說「最多」，是因為沙星族用的智商分數其實是最低估計——對圓星族最寬鬆的情況。", "tags": [{"k": "vocab", "v": "most generous situation", "native": "best-case assumption for someone", "nativeZh": "對某方最寬鬆的情況", "examples": ["Even in the most generous situation, we're short on time.", "Use the most generous estimate first."], "usage": "討論估算、談判時實用。"}], "notes": []}, {"id": 46, "start": 351.774, "end": 358.664, "en": "I think that if if I was going to edit this at all, I would call them Moon Stars because of the the crescent moon.", "zh": "我覺得如果要改名字，我會叫他們月星族，因為有新月那個符號。", "tags": [{"k": "phrase", "v": "if I was going to…, I would…", "native": "hypothetical preference", "nativeZh": "如果我要……，我會……", "examples": ["If I was going to move, I would choose Taipei.", "If I were going to rewrite it, I'd start shorter."], "usage": "虛擬語氣談假設選擇；正式寫作常用 If I were。"}], "notes": []}, {"id": 47, "start": 358.654, "end": 368.105, "en": "I I a small edit in my mind. If we were to use the upper end estimates for Sand Star IQ, Circle Stars would drop below 100. This is surprising", "zh": "我心裡小小改一下。如果改用沙星族智商的高估估計，圓星族會掉到 100 以下。這對很多人來說是", "tags": [{"k": "phrase", "v": "If we were to…", "native": "formal hypothetical", "nativeZh": "倘若我們……的話", "examples": ["If we were to launch next month, we'd need more staff.", "If we were to be honest, the plan is rushed."], "usage": "比 If we 稍正式，簡報假設情境好用。"}], "notes": []}, {"id": 48, "start": 368.015, "end": 377.465, "en": "news for a lot of people because in this fictional world, Circle Stars are often vastly overrepresented in many awards and high offices, which is often accredited to their debunked", "zh": "很驚人的消息，因為在這個虛構世界裡，圓星族在很多獎項和高階職位上往往嚴重超額代表，而這常被歸因於他們那套已被戳破的", "tags": [{"k": "vocab", "v": "overrepresented", "native": "appearing more than the share suggests", "nativeZh": "過度代表、比例偏高", "examples": ["Women are still underrepresented in that field.", "That group is overrepresented in awards."]}, {"k": "vocab", "v": "accredited to", "native": "attributed to (sometimes formal)", "nativeZh": "被歸因於", "examples": ["Success was accredited to teamwork.", "The win is often accredited to luck."], "usage": "也可更常見說 attributed to。"}], "notes": []}, {"id": 49, "start": 377.415, "end": 388.065, "en": "extraordinary intellect. And perhaps, that is exactly why their scores are lied about because maybe these awards and offices are not being truly distributed solely by merit as intended,", "zh": "超凡智力。或許這正是分數被謊報的原因：也許這些獎項與職位並沒有真正只按能力分配，", "tags": [{"k": "phrase", "v": "solely by merit", "native": "only based on ability / deservingness", "nativeZh": "完全依能力／功過", "examples": ["Promotions should be decided solely by merit.", "Seats aren't awarded solely by merit."], "usage": "談公平與任人唯賢時常用。"}, {"k": "phrase", "v": "that is exactly why…", "native": "pinpointing the reason", "nativeZh": "那正是……的原因", "examples": ["That's exactly why I left early.", "That is exactly why we need a backup plan."], "usage": "強調因果，語氣明確。"}], "notes": []}, {"id": 50, "start": 388.295, "end": 392.545, "en": "but instead partially by tribal affiliation USING FAKE IQS.", "zh": "而是部分靠部落／小圈子效忠——還用假智商撐場面。", "tags": [{"k": "vocab", "v": "tribal affiliation", "native": "loyalty to one's group", "nativeZh": "小圈子／部落式效忠", "examples": ["Hiring by tribal affiliation hurts quality.", "Online debates often follow tribal affiliation."]}], "notes": []}, {"id": 51, "start": 393.695, "end": 404.905, "en": "WITH THE Circle Stars addressed, what about the triangles? Yes, they also blatantly cheat IQ scores, especially this country, Winnie-the-Pooh-land, which reports an average IQ of 105 to", "zh": "圓星族講完了，那三角形呢？對，他們也公然灌水智商分數，尤其這個「小熊維尼國」，回報平均智商 105 到", "tags": [], "notes": []}, {"id": 52, "start": 404.375, "end": 413.625, "en": "109. They do this in a pretty obvious way by primarily sampling only the richest and most developed provinces instead of something truly representative of their population.", "zh": "109。手法很明顯：主要只抽樣最有錢、最發達的省份，而不是真正能代表全國人口的樣本。", "tags": [{"k": "phrase", "v": "in a pretty obvious way", "native": "clearly; not subtle", "nativeZh": "以相當明顯的方式", "examples": ["He was fishing for compliments in a pretty obvious way.", "They cut costs in a pretty obvious way."]}, {"k": "vocab", "v": "representative of", "native": "typical of the whole group", "nativeZh": "能代表……的", "examples": ["Is this sample representative of users?", "One story isn't representative of everyone."], "usage": "研究、問卷、新聞評論高頻。"}], "notes": []}, {"id": 53, "start": 413.895, "end": 422.305, "en": "You'd think if they were as smart as they say, they'd cheat in a less obvious way, but no. Winnie-the-Pooh-land has an incredible population of over 1 billion.", "zh": "你會覺得他們若真那麼聰明，作假也該更低調一點，但沒有。小熊維尼國人口超過十億，多到不可思議。", "tags": [{"k": "phrase", "v": "You'd think…, but…", "native": "expectation vs reality", "nativeZh": "照理說……但……", "examples": ["You'd think it'd be cheaper online, but it isn't.", "You'd think he'd apologize, but he doubled down."], "usage": "吐槽「預期落空」超好用。"}], "notes": []}, {"id": 54, "start": 422.135, "end": 430.825, "en": "That's a lot of If their intelligence was as they claimed, they'd be an absolute factory for geniuses. So, why is it that instead of inventing anything, they rely on", "zh": "那可多了。如果智力真如他們所說，那會是天才工廠。那為什麼什麼都不發明，反而靠", "tags": [{"k": "phrase", "v": "why is it that…?", "native": "asking for the underlying reason", "nativeZh": "為什麼會……？", "examples": ["Why is it that the Wi-Fi dies at 8pm?", "Why is it that simple tasks take forever?"], "usage": "比 Why 更強調「奇怪的現象需要解釋」。"}, {"k": "phrase", "v": "rely on", "native": "depend on", "nativeZh": "依賴……", "examples": ["Don't rely on memory alone—write it down.", "The plan relies on good weather."]}], "notes": []}, {"id": 55, "start": 430.295, "end": 434.825, "en": "stealing technology and trade secrets from Circle countries? The other triangles cheat, too.", "zh": "從圓形國家偷技術與商業機密？其他三角形也一樣作弊。", "tags": [], "notes": []}, {"id": 56, "start": 434.295, "end": 439.785, "en": "Wow, the other triangles cheat, too. OH LORD, DO THEY EVER?", "zh": "哇，其他三角形也作弊。喔天啊，還真的很會。", "tags": [{"k": "phrase", "v": "Oh lord, do they ever?", "native": "emphatic 'yes, extremely'", "nativeZh": "喔天啊，還真的超……", "examples": ["Are they competitive? Oh lord, do they ever.", "Does she talk a lot? Does she ever."], "usage": "美式口語強調肯定：Do they ever!"}], "notes": []}, {"id": 57, "start": 439.735, "end": 450.745, "en": "Triangle culture puts a massive emphasis on academia, test scores, and similar, and they start young making their children study hard for long hours since infancy. IQ scores are meant to measure", "zh": "三角形文化極度強調學業、考試分數之類的，而且很小就開始，讓孩子從嬰幼兒起長時間苦讀。智商分數本來要量的是", "tags": [{"k": "phrase", "v": "puts a massive emphasis on…", "native": "strongly prioritizes", "nativeZh": "極度強調……", "examples": ["The school puts a massive emphasis on sports.", "Our team puts emphasis on clarity."], "usage": "put emphasis on = 把重點放在。"}, {"k": "phrase", "v": "start young", "native": "begin from an early age", "nativeZh": "從小就開始", "examples": ["Musicians often start young.", "If you start young, languages stick better."]}], "notes": []}, {"id": 58, "start": 450.495, "end": 460.095, "en": "raw intellect, not knowledge, but the tests we create are not perfect as it's really hard to design questions that don't lean on at least a tiny bit of prior knowledge.", "zh": "原始智力，不是知識；但我們出的題不可能完美，因為很難設計完全不依賴一點先備知識的題目。", "tags": [{"k": "phrase", "v": "lean on", "native": "depend on / use as support", "nativeZh": "倚賴、靠……", "examples": ["You can lean on me if you're stressed.", "The question leans on prior knowledge."], "usage": "可指情緒依靠，也可指題目依賴背景知識。"}, {"k": "vocab", "v": "prior knowledge", "native": "what you already know", "nativeZh": "先備知識", "examples": ["The course assumes some prior knowledge.", "Good teaching activates prior knowledge."]}], "notes": []}, {"id": 59, "start": 460.055, "end": 468.185, "en": "That's why I never feel bad whenever I always try to make her feel better when Kacey flops out on one of her like little tests that she'll take on stream.", "zh": "所以每當 Kacey 在直播小測驗考砸，我試著安慰她時，我從不覺得過意不去。", "tags": [{"k": "phrase", "v": "make her feel better", "native": "comfort someone", "nativeZh": "讓她好受一點", "examples": ["I brought tea to make her feel better.", "A short walk might make you feel better."], "usage": "安慰人的日常說法。"}, {"k": "phrase", "v": "flop (out) on…", "native": "fail / do badly at", "nativeZh": "搞砸、表現很差", "examples": ["I flopped on the interview.", "He flopped on the exam live."], "usage": "口語，flop＝失敗得明顯。"}], "notes": []}, {"id": 60, "start": 468.095, "end": 476.985, "en": "So, like I was asking her, she was telling me yesterday that she like she that she liked a lot of history, which now like you shouldn't have said that.", "zh": "我昨天問她，她說她很喜歡歷史——結果你不該說這句的。", "tags": [{"k": "phrase", "v": "you shouldn't have said that", "native": "regret after revealing something", "nativeZh": "你不該說這句的", "examples": ["Oops—you shouldn't have said that in front of the boss.", "I shouldn't have said that out loud."], "usage": "半開玩笑提醒「說漏嘴」。"}], "notes": []}, {"id": 61, "start": 476.815, "end": 485.225, "en": "Do you know what this means for her? This means that she gets to watch a 2-hour documentary on YouTube about the Roman Empire soon. She's going to be", "zh": "你知道這對她意味著什麼嗎？意味著她很快要看一部兩小時的羅馬帝國 YouTube 紀錄片。她這週就會", "tags": [{"k": "phrase", "v": "Do you know what this means for…?", "native": "explaining consequences", "nativeZh": "你知道這對……意味著什麼嗎？", "examples": ["Do you know what this means for our deadline?", "Do you know what this means for your budget?"], "usage": "引出後果說明，語氣可以認真也可以玩笑。"}], "notes": []}, {"id": 62, "start": 484.695, "end": 492.267, "en": "seeing that this week. I need a refresher myself, honestly. I haven't watched any videos, but yeah, and she said it's important. And I I went", "zh": "看到了。說實話我自己也需要複習一下。我還沒看那些影片，不過她說這很重要。然後我就", "tags": [{"k": "phrase", "v": "I need a refresher", "native": "I need to review something again", "nativeZh": "我需要複習一下", "examples": ["I need a refresher on Excel.", "Can you give me a quick refresher?"], "usage": "職場學習高頻：refresher＝複習課／快速回顧。"}], "notes": []}, {"id": 63, "start": 491.857, "end": 495.937, "en": "through and I asked her like 50 questions, bro. I did. I asked her like 50 questions.", "zh": "一口氣問了她大概五十題，真的，問了大概五十題。", "tags": [{"k": "phrase", "v": "I asked her like 50 questions", "native": "emphasizing how many (casual)", "nativeZh": "我問了她大概五十題", "examples": ["I sent like 20 emails today.", "There were like 50 people in line."], "usage": "like 在口語常當「大概」的模糊語。"}], "notes": []}, {"id": 64, "start": 495.977, "end": 503.787, "en": "And she's going to learn. See, she's going to learn. And to be fair, to be credit to her, the one that she did know was Napoleon.", "zh": "然後她就會學到了。看吧，她會學到。公平地說，要給她點肯定：她確實知道的是拿破崙。", "tags": [{"k": "phrase", "v": "to be fair", "native": "adding a balanced point", "nativeZh": "公平地說／話說回來", "examples": ["To be fair, he did warn us.", "To be fair, the test was unusually hard."], "usage": "先批評後補平衡觀點，討論很加分。"}], "notes": []}, {"id": 65, "start": 504.057, "end": 509.107, "en": "She knew Napoleon, and she knew, of course, Genghis Khan, where he was from.", "zh": "她知道拿破崙，當然也知道成吉思汗是哪裡人。", "tags": [], "notes": []}, {"id": 66, "start": 509.177, "end": 519.547, "en": "She knew them for sure. So, a culture that puts abnormal focus on education early on will have their early life IQ scores skewed. Not only that, triangles have also shown an", "zh": "那些她確實知道。所以，一個異常重視早期教育的文化，會讓早期人生的智商分數被扭曲。不僅如此，三角形也表現出", "tags": [{"k": "vocab", "v": "skewed", "native": "distorted; not balanced", "nativeZh": "被扭曲的、偏斜的", "examples": ["The sample is skewed toward young users.", "Stress can skew your judgment."], "usage": "數據與判斷都可用。"}], "notes": []}, {"id": 67, "start": 519.017, "end": 527.587, "en": "obsessive degree of pride in the pursuit of getting the highest score possible. One of the easiest ways to cheat IQ tests is to take another one, as they'll", "zh": "近乎執著的驕傲，一心要拿到最高分。作弊最簡單的方式之一就是再考一次——因為他們會", "tags": [{"k": "phrase", "v": "in the pursuit of…", "native": "while trying to get…", "nativeZh": "在追求……的過程中", "examples": ["In the pursuit of growth, they forgot quality.", "Don't lose sleep in the pursuit of perfection."], "usage": "稍正式，談目標代價時好用。"}, {"k": "phrase", "v": "One of the easiest ways to… is to…", "native": "giving a simple method", "nativeZh": "最簡單的方法之一是……", "examples": ["One of the easiest ways to improve is to review daily.", "One of the easiest ways to save money is to cook at home."], "usage": "給建議的萬用模板。"}], "notes": []}, {"id": 68, "start": 527.057, "end": 535.267, "en": "be more used to the types of questions. Whereas circles are more likely to see IQ scores as medical reports of useful information, triangles are more likely", "zh": "更熟悉題型。圓形比較常把智商分數當成有用資訊的「檢查報告」，三角形則更常", "tags": [{"k": "phrase", "v": "be more used to…", "native": "have more familiarity with", "nativeZh": "更習慣……", "examples": ["I'm more used to dark mode now.", "Kids are used to touch screens."], "usage": "used to + 名詞／V-ing：習慣某事物（不是過去常做的 used to）。"}, {"k": "phrase", "v": "are more likely to…", "native": "have a higher chance of…", "nativeZh": "更可能……", "examples": ["Tired drivers are more likely to crash.", "You're more likely to remember what you teach."], "usage": "機率／傾向句型，解釋行為差異超常用。"}], "notes": []}, {"id": 69, "start": 534.897, "end": 543.227, "en": "to see them as school grades. Meaning if they're dissatisfied, they'll keep retaking to try to get the maximum score, as they've likely been doing their entire life.", "zh": "把它當學校成績。意思是：不滿意就重考衝最高分，就像他們一輩子都在做的那樣。", "tags": [{"k": "phrase", "v": "Meaning if…, they'll…", "native": "conditional implication", "nativeZh": "意思是：如果……，他們就會……", "examples": ["The store closes at 8. Meaning if we're late, we'll miss it."], "usage": "口語推論＋條件。"}], "notes": []}, {"id": 70, "start": 543.017, "end": 546.707, "en": "Of course. This reflects itself in their performance on other aspects of life.", "zh": "當然。這也反映在他們生活其他面向的表現上。", "tags": [], "notes": []}, {"id": 71, "start": 546.857, "end": 550.947, "en": "IQ, not academics, is the best predictor of success we have.", "zh": "智商，不是學業成績，才是我們擁有的最佳成功預測指標。", "tags": [{"k": "phrase", "v": "X, not Y, is the best…", "native": "contrast priority", "nativeZh": "是 X 而不是 Y，才是最好的……", "examples": ["Sleep, not caffeine, is the best fix.", "Clarity, not slang, is the best style here."], "usage": "對比強調句型，簡報很好用。"}], "notes": []}, {"id": 72, "start": 550.777, "end": 559.947, "en": "It is, cuz like if you're smart, you can figure anything out. Like if if you are above average intelligence, and you have the mental capacity to figure things", "zh": "對，因為如果你聰明，什麼都想得通。如果你智力在平均以上，又有把事情想清楚的腦力，", "tags": [{"k": "phrase", "v": "figure anything out", "native": "solve whatever comes up", "nativeZh": "什麼都想得通／搞定", "examples": ["With enough time, she can figure anything out.", "Don't panic—we'll figure it out."], "usage": "figure out 的強調版，充滿自信。"}, {"k": "phrase", "v": "above average", "native": "better than the typical level", "nativeZh": "高於平均", "examples": ["His English is above average.", "Above-average focus beats raw talent sometimes."]}], "notes": []}, {"id": 73, "start": 559.617, "end": 566.907, "en": "out, it doesn't matter what problem somebody gives you, you're just going to figure it out. Like that's why like whenever I have like a team of people", "zh": "不管別人丟什麼問題給你，你就是會想辦法搞定。所以每當我有一組人", "tags": [{"k": "phrase", "v": "it doesn't matter what…", "native": "whatever X is, still…", "nativeZh": "不管……是什麼都沒關係", "examples": ["It doesn't matter what they say—keep going.", "It doesn't matter what tool you use, just ship it."], "usage": "排除干擾條件，語氣堅定。"}], "notes": []}, {"id": 74, "start": 566.577, "end": 574.907, "en": "that do things, I don't need to worry about like whether they're experienced in it or not. I can tell them like figure out how to", "zh": "在做事，我不需要擔心他們有沒有相關經驗。我可以直接叫他們去想辦法——", "tags": [{"k": "phrase", "v": "I don't need to worry about…", "native": "no need for concern", "nativeZh": "我不需要擔心……", "examples": ["I don't need to worry about parking here.", "With a checklist, you don't need to worry about forgetting steps."]}, {"k": "phrase", "v": "whether… or not", "native": "no matter if", "nativeZh": "無論是否……", "examples": ["Whether it rains or not, we'll play.", "Tell me whether you're free or not."], "usage": "選擇／條件萬能結構。"}], "notes": []}, {"id": 75, "start": 575.177, "end": 582.217, "en": "uh how to make a slaughterhouse for pigs, and they'll figure that out. Be easy. But it's a less reliable for triangles than for circles.", "zh": "比方說怎麼蓋豬的屠宰場，他們就能搞懂，很簡單。但這對三角形來說，可信度比對圓形低。", "tags": [], "notes": []}, {"id": 76, "start": 581.817, "end": 592.907, "en": "in, bacon comes out. bit higher, yet perform at a level below what their IQ would predict. In other words, [music] below a circle with the same IQ, especially in innovation.", "zh": "豬進去，培根出來。分數高一點，表現卻低於智商所預測的水準。換句話說，低於同等智商的圓形，尤其在創新上。", "tags": [{"k": "phrase", "v": "In other words,…", "native": "rephrasing for clarity", "nativeZh": "換句話說……", "examples": ["In other words, we need more time.", "He's not lazy—in other words, he's burned out."], "usage": "換說法讓聽者更好懂，教學與會議必備。"}, {"k": "phrase", "v": "below what … would predict", "native": "worse than expected from a model", "nativeZh": "低於……所預測的水準", "examples": ["Sales came in below what the model would predict."]}], "notes": []}, {"id": 77, "start": 593.057, "end": 603.987, "en": "Man. Their overemphasis on academic scores does not compensate in the real world, and actually negatively impacts the economy, as it forces higher performing circles to waste time competing to get", "zh": "唉。他們過度強調學業分數，在現實世界補不回來，甚至還拖累經濟，因為逼表現更好的圓形浪費時間去競爭", "tags": [{"k": "vocab", "v": "overemphasis on…", "native": "putting too much weight on", "nativeZh": "過度強調……", "examples": ["There's an overemphasis on test scores.", "Overemphasis on speed hurts quality."]}, {"k": "phrase", "v": "waste time (doing…)", "native": "spend time uselessly", "nativeZh": "浪費時間（做……）", "examples": ["Don't waste time arguing online.", "We wasted time competing for titles."], "usage": "勸人把力氣用在刀口上。"}], "notes": []}, {"id": 78, "start": 603.537, "end": 607.907, "en": "more useless academic accolades before being able to qualify for actual work.", "zh": "更多沒用的學歷榮銜，才有資格做真正的工作。", "tags": [{"k": "vocab", "v": "accolades", "native": "awards / praise", "nativeZh": "榮譽、讚譽", "examples": ["She earned accolades for the design.", "He cares more about work than accolades."], "usage": "偏書面，談獎項與名聲。"}, {"k": "phrase", "v": "before being able to…", "native": "prior to having the chance to…", "nativeZh": "在能夠……之前", "examples": ["Wash your hands before being able to eat? Wait—before you eat.", "Finish training before being able to take calls."]}], "notes": []}, {"id": 79, "start": 607.737, "end": 615.588, "en": "I I thought this, too. I always thought if you graduate from business school, you should fail. Cuz like everybody that I knew that did anything important, all", "zh": "我也這樣想過。我一直覺得：如果你從商學院畢業，反而該算失敗。因為我認識每個做成大事的人，", "tags": [{"k": "phrase", "v": "I always thought…", "native": "long-held belief", "nativeZh": "我一直覺得……", "examples": ["I always thought he'd move abroad.", "I always thought mornings were hard—until I slept earlier."], "usage": "分享舊有看法，常接 but now…"}], "notes": []}, {"id": 80, "start": 615.178, "end": 622.308, "en": "of them dropped out. They did. Like in like I get like okay, if you're trying to run a business, like all right, maybe", "zh": "全都輟學了。真的。我懂，如果你是想經營公司，好吧，也許", "tags": [{"k": "phrase", "v": "dropped out", "native": "quit school before finishing", "nativeZh": "輟學", "examples": ["He dropped out in the second year.", "She dropped out to start a company."], "usage": "教育與創業故事高頻。"}, {"k": "phrase", "v": "I get it", "native": "I understand", "nativeZh": "我懂、我理解", "examples": ["I get it—you're tired.", "I get why you're upset."], "usage": "口語 empathize 短句。"}], "notes": []}, {"id": 81, "start": 621.978, "end": 631.058, "en": "you should get an MBA. But like if you graduate if you graduate from like entrepreneurship school, it's like well, obviously that didn't work, right? Very easy.", "zh": "你該去讀個 MBA。但如果連「創業學校」都順利畢業——那不就很明顯，創業沒搞成嗎？很簡單。", "tags": [{"k": "phrase", "v": "it's like, well, obviously…", "native": "casual 'that clearly means…'", "nativeZh": "那就很明顯……吧", "examples": ["If the store is empty, it's like, well, obviously something's wrong."], "usage": "美式口語推理，語氣輕鬆帶點嘲諷。"}], "notes": []}, {"id": 82, "start": 629.898, "end": 640.108, "en": "If a number one exists for raw intelligence, my bet would be the circles. It was circles who conquered the world, who developed the technology using to communicate. The ones everyone", "zh": "若真有「原始智力第一名」，我賭是圓形。是圓形征服世界、發展出我們用來溝通的技術。是大家都想", "tags": [{"k": "phrase", "v": "my bet would be…", "native": "my guess / prediction", "nativeZh": "我賭／我猜會是……", "examples": ["My bet would be that they delay the launch.", "My bet would be the simpler option."], "usage": "溫和提出預測，比 I'm sure 客氣。"}], "notes": []}, {"id": 83, "start": 639.858, "end": 648.338, "en": "else tries to copy or emigrate to. Since IQ is just problem solving, long-term historical success is its best predictor.", "zh": "模仿或移民過去的那些人。既然智商就是解決問題，長期歷史成就才是它最好的預測指標。", "tags": [{"k": "phrase", "v": "emigrate to", "native": "leave home country to settle elsewhere", "nativeZh": "移民到……", "examples": ["They emigrated to Canada.", "Many people want to emigrate to places with better jobs."], "usage": "注意：emigrate（從原鄉離開）vs immigrate（進入新國家）。"}], "notes": []}, {"id": 84, "start": 647.858, "end": 659.828, "en": "Also, um America is a very bad country to look at IQ from. Uh because there are there's a massive combination of squares, circles, triangles, stars, and", "zh": "還有，美國很不適合拿來討論智商。因為那裡混了超多方形、圓形、三角形、星星，", "tags": [{"k": "phrase", "v": "a very bad country / place to look at X from", "native": "a poor sample for studying X", "nativeZh": "很不適合用來觀察／討論 X", "examples": ["That's a bad sample to look at trends from.", "Email is a bad place to look at tone from."], "usage": "提醒樣本偏差的口語說法。"}], "notes": []}, {"id": 85, "start": 659.378, "end": 668.308, "en": "everything. So it's kind of like just kind of it's like grabbing out of uh you know, like a candy bucket with like all the different candies in it. Sometimes", "zh": "什麼都有。有點像把手伸進糖果桶，裡面什麼糖都有。有時候", "tags": [{"k": "phrase", "v": "it's kind of like…", "native": "making a soft analogy", "nativeZh": "有點像……", "examples": ["It's kind of like learning to drive.", "The feeling is kind of like stage fright."], "usage": "解釋時先打個比方，語氣軟。"}], "notes": []}, {"id": 86, "start": 668.258, "end": 674.538, "en": "you're going to get, you know, a Jolly Rancher and other times you're going to get candy corn. It's not so good.", "zh": "你會抽到 Jolly Rancher，有時候抽到玉米糖。沒那麼好。", "tags": [{"k": "phrase", "v": "Sometimes you're going to get X, and other times you're going to get Y.", "native": "describing mixed outcomes", "nativeZh": "有時得到 X，有時得到 Y", "examples": ["Sometimes you're going to get lucky, and other times you're going to get delayed.", "Some days you get focus; other days you get distractions."], "usage": "描述不穩定／抽樣結果的口語模板。"}, {"k": "phrase", "v": "It's not so good.", "native": "mild negative evaluation", "nativeZh": "沒那麼好", "examples": ["The ending is not so good.", "Reception here is not so good."], "usage": "語氣比 It's bad 溫和。"}], "notes": []}];
const YT = "https://www.youtube.com/watch?v=kaCx0j-19OQ";
const AUDIO_CANDIDATES = [
  "https://github.com/nico-lao/Grok-Bot/releases/download/iq-115-audio-v1/iq-115.mp3",
  "audio.mp3",
  "./audio.mp3"
];

const player = document.getElementById('player');
const spoiler = document.getElementById('spoiler');
const revealedBody = document.getElementById('revealedBody');
const progressEl = document.getElementById('progress');
const numEl = document.getElementById('num');
const timeEl = document.getElementById('timeRange');
const tagHint = document.getElementById('tagHint');
const statusEl = document.getElementById('status');
const btnPlay = document.getElementById('btnPlay');
const btnReveal = document.getElementById('btnReveal');
const btnHide = document.getElementById('btnHide');
const btnReplay = document.getElementById('btnReplay');
const btnPrev = document.getElementById('btnPrev');
const btnNext = document.getElementById('btnNext');
const btnYoutube = document.getElementById('btnYoutube');

let filter = 'all';
let order = SEGMENTS.map((_, i) => i);
let pos = 0; // index into order
let revealed = false;
let playToken = 0;
let stopAtSec = 0;
let audioReady = false;

function esc(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}

function fmt(sec) {
  sec = Math.max(0, sec || 0);
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m + ':' + String(s).padStart(2, '0');
}

function hasKind(seg, k) {
  return (seg.tags || []).some(t => t.k === k);
}

function rebuildOrder() {
  order = [];
  for (let i = 0; i < SEGMENTS.length; i++) {
    const s = SEGMENTS[i];
    const tags = s.tags || [];
    if (filter === 'all') order.push(i);
    else if (filter === 'phrase' && hasKind(s, 'phrase')) order.push(i);
    else if (filter === 'vocab' && hasKind(s, 'vocab')) order.push(i);
    else if (filter === 'tagged' && tags.length) order.push(i);
  }
  if (!order.length) {
    statusEl.textContent = '此篩選沒有段落，已回到「全部」。';
    filter = 'all';
    document.querySelectorAll('#filterSeg button').forEach(b => {
      b.classList.toggle('active', b.dataset.filter === 'all');
    });
    rebuildOrder();
    return;
  }
  pos = Math.min(pos, order.length - 1);
}

function current() { return SEGMENTS[order[pos]]; }

function markerHtml(t) {
  const kind = t.k === 'vocab' ? 'vocab' : 'phrase';
  const label = kind === 'vocab'
    ? `【單字：${esc(t.v)}】`
    : `【學習句：${esc(t.v)}】`;
  const ex = (t.examples || []).map(e => `<li>${esc(e)}</li>`).join('');
  const usage = t.usage ? `<div class="usage">Usage：${esc(t.usage)}</div>` : '';
  const nativeLine = t.native
    ? `<div class="native-use"><strong>Native use / 母語情境</strong>：${esc(t.native)}${t.nativeZh ? '（' + esc(t.nativeZh) + '）' : ''}</div>`
    : '';
  return `<div class="marker ${kind}">
    <div class="label">${label}</div>
    ${ex ? `<ul class="examples">${ex}</ul>` : ''}
    ${usage}
    ${nativeLine}
  </div>`;
}

function buildRevealedHtml(s) {
  const tags = s.tags || [];
  const pills = tags.map(t => {
    const kind = t.k === 'vocab' ? 'vocab' : 'phrase';
    const name = kind === 'vocab' ? '單字' : '學習句';
    return `<span class="tag ${kind}">${name}：${esc(t.v)}</span>`;
  }).join('');
  const markers = tags.map(markerHtml).join('');
  return `
    <div class="label-en">原文</div>
    <div class="en">${esc(s.en)}</div>
    <div class="label-zh">翻譯</div>
    <div class="zh">${esc(s.zh)}</div>
    ${pills ? `<div class="tags">${pills}</div>` : '<p class="note">此段暫無學習句／單字標記。</p>'}
    ${markers}
  `;
}

function hideContent() {
  revealed = false;
  spoiler.classList.add('locked');
  spoiler.classList.remove('open');
  revealedBody.innerHTML = '';
  btnHide.disabled = true;
  btnReveal.disabled = false;
}

function showContent() {
  const s = current();
  revealed = true;
  revealedBody.innerHTML = buildRevealedHtml(s);
  spoiler.classList.remove('locked');
  spoiler.classList.add('open');
  btnHide.disabled = false;
  btnReveal.disabled = true;
}

function render() {
  const s = current();
  progressEl.textContent = (pos + 1) + ' / ' + order.length + (filter !== 'all' ? `（篩選 · 全庫 ${SEGMENTS.length}）` : '');
  numEl.textContent = String(s.id);
  timeEl.textContent = fmt(s.start) + ' – ' + fmt(s.end);
  const nPhrase = (s.tags || []).filter(t => t.k === 'phrase').length;
  const nVocab = (s.tags || []).filter(t => t.k === 'vocab').length;
  const bits = [];
  if (nPhrase) bits.push('學習句 ' + nPhrase);
  if (nVocab) bits.push('單字 ' + nVocab);
  tagHint.textContent = bits.length ? ('本段有 ' + bits.join(' · ')) : '本段無標記（仍有原文／翻譯）';
  hideContent();
  btnPrev.disabled = pos <= 0;
  btnNext.disabled = pos >= order.length - 1;
  if (!statusEl.textContent.includes('音訊')) statusEl.textContent = '';
  stopClip(false);
}

function resetPlayBtn() {
  btnPlay.disabled = false;
  btnPlay.textContent = '▶ 播放';
}

function stopClip(resetBtn = true) {
  playToken += 1;
  try { player.pause(); } catch (_) {}
  if (resetBtn) resetPlayBtn();
}

function onTick() {
  try {
    if (player.currentTime >= stopAtSec - 0.04) {
      const token = playToken;
      try { player.pause(); } catch (_) {}
      if (token === playToken) resetPlayBtn();
    }
  } catch (_) {}
}

async function playSeg() {
  const s = current();
  if (!audioReady) {
    statusEl.textContent = '音訊還在載入，請稍候再按播放。';
    return;
  }
  stopClip(false);
  const token = ++playToken;
  stopAtSec = s.end;
  btnPlay.disabled = true;
  btnPlay.textContent = '播放中…';
  const startPlay = () => {
    if (token !== playToken) return;
    const p = player.play();
    if (p && p.catch) p.catch(() => {
      statusEl.textContent = '無法自動播放，請先點一下頁面或音訊控件。';
      resetPlayBtn();
    });
  };
  try { player.currentTime = s.start; } catch (_) {}
  if (Math.abs((player.currentTime || 0) - s.start) > 0.35) {
    const onSeeked = () => {
      player.removeEventListener('seeked', onSeeked);
      startPlay();
    };
    player.addEventListener('seeked', onSeeked);
    try { player.currentTime = s.start; } catch (_) { startPlay(); }
  } else {
    startPlay();
  }
}

btnPlay.addEventListener('click', playSeg);
btnReplay.addEventListener('click', playSeg);
btnReveal.addEventListener('click', showContent);
btnHide.addEventListener('click', hideContent);
btnPrev.addEventListener('click', () => { if (pos > 0) { pos -= 1; render(); } });
btnNext.addEventListener('click', () => { if (pos < order.length - 1) { pos += 1; render(); } });
btnYoutube.addEventListener('click', () => {
  const s = current();
  const url = YT + (YT.includes('?') ? '&' : '?') + 't=' + Math.floor(s.start) + 's';
  window.open(url, '_blank', 'noopener');
});
document.querySelectorAll('#filterSeg button').forEach(btn => {
  btn.addEventListener('click', () => {
    filter = btn.dataset.filter;
    document.querySelectorAll('#filterSeg button').forEach(b => b.classList.toggle('active', b === btn));
    pos = 0;
    rebuildOrder();
    render();
  });
});

player.addEventListener('timeupdate', onTick);
player.addEventListener('ended', () => resetPlayBtn());

async function loadAudio() {
  for (const src of AUDIO_CANDIDATES) {
    try {
      await new Promise((resolve, reject) => {
        const onOk = () => { cleanup(); resolve(); };
        const onErr = () => { cleanup(); reject(new Error('fail')); };
        const cleanup = () => {
          player.removeEventListener('loadedmetadata', onOk);
          player.removeEventListener('canplay', onOk);
          player.removeEventListener('error', onErr);
        };
        player.addEventListener('loadedmetadata', onOk);
        player.addEventListener('canplay', onOk);
        player.addEventListener('error', onErr);
        player.src = src;
        player.load();
      });
      audioReady = true;
      statusEl.textContent = '音訊已就緒。';
      return;
    } catch (_) {}
  }
  statusEl.textContent = '音訊載入失敗：請檢查網路或稍後再試。';
}

rebuildOrder();
render();
loadAudio();
</script>
