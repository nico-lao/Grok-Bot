elf using rationality and critical thinking so let's get specific though let's define bigoted", "zh": "實際情況，用理性與批判思考。那我們講具體一點——我們先定義什麼叫偏執／歧視性的", "tags": [{"k": "vocab", "v": "critical thinking", "native": "used when urging careful checking of claims instead of blind acceptance", "nativeZh": "提醒用證據邏輯檢驗主張"}], "notes": [{"label": "單字：critical thinking", "ex": ["Schools should teach critical thinking, not just memorization."], "use": "批判思考：用證據與邏輯檢驗主張，教育與媒體素養討論核心詞。", "native": "used when urging careful checking of claims instead of blind acceptance", "nativeZh": "提醒用證據邏輯檢驗主張"}]}, {"id": 9, "start": 58.0, "end": 66.0, "en": "Opinions what opinions are bigot is we're going to treat this as a thought experiment I'm not going to say what's right or wrong or what way to think the whole point is to learn how to think not", "zh": "觀點。什麼樣的意見算「偏執」？我們把這當成一個思想實驗。我不會說什麼對什麼錯、該怎麼想；重點是學會「如何思考」，而不是 （同段：the whole point is to learn how to think not what to think）", "tags": [{"k": "phrase", "v": "Let's treat this as a thought experiment.", "native": "used when cooling a heated debate so you can explore ideas without committing", "nativeZh": "先降溫、當假設來討論"}, {"k": "phrase", "v": "The whole point is to…", "native": "used when pulling a discussion back to its real purpose", "nativeZh": "把討論拉回真正目的"}, {"k": "vocab", "v": "thought experiment", "native": "used when proposing a hypothetical to test logic without endorsing it", "nativeZh": "提出假設來測邏輯、未必採納"}], "notes": [{"label": "單字：thought experiment", "ex": ["This is just a thought experiment, not a policy proposal."], "use": "思想實驗：假設情境來測試推理，不代表立刻採納結論。", "native": "used when proposing a hypothetical to test logic without endorsing it", "nativeZh": "提出假設來測邏輯、未必採納"}]}, {"id": 10, "start": 66.0, "end": 71.0, "en": "What to think so when you say bigot you you're you're starting with the conclusion that given her bigoted", "zh": "「該想什麼」。所以當你說「偏執者」時，你其實已經先下了結論：假定她那些觀點是偏執的 （承接上句 whole point）", "tags": [{"k": "phrase", "v": "The whole point is to…", "native  "觀看時長。這是負面；但長期來看，react 內容仍然", "tags": [], "notes": []}, {"id": 120, "start": 940.0, "end": 947.0, "en": "Be incredibly beneficial while the initial burst of traffic from a big Creator's reaction may not convert into", "zh": "可以非常有幫助。大創作者反應帶來的流量爆發，也許不會立刻轉成", "tags": [], "notes": []}, {"id": 121, "start": 947.0, "end": 954.0, "en": "Consistent viewership right away it does something equally important it puts your content in front of a massive audience", "zh": "穩定觀眾，但它做了同樣重要的事：把你的內容推到一大群", "tags": [], "notes": []}, {"id": 122, "start": 954.0, "end": 959.0, "en": "That would have otherwise never discovered you channels that I've watched and they've they've received a", "zh": "本來永遠不會發現你的人面前。我看過的一些頻道，因為我看了他們的影片之類的，", "tags": [], "notes": []}, {"id": 123, "start": 959.0, "end": 964.0, "en": "Pretty big boost by like just me seeing their videos or whatever I mean it it it", "zh": "確實拿到不小的助推。這在邏輯上也說得通。", "tags": [], "notes": []}, {"id": 124, "start": 964.0, "end": 970.0, "en": "It's logical that that would happen as well and yeah I think anybody could assume that percentage of these viewers", "zh": "對，誰都能假設這些觀眾裡有一定比例", "tags": [], "notes": []}, {"id": 125, "start": 970.0, "end": 978.0, "en": "Don't stick around small fraction will those who genuinely enjoy your content beyond the reaction will come back and", "zh": "不會留下；但一小部分會。真正喜歡你內容、不只是看反應的人，會回來", "tags": [], "notes": []}, {"id": 126, "start": 978.0, "end": 984.0, "en": "Watch more of your videos and engage with your channel over time these are the people who become part of your core", "zh": "看更多、長期互動；這些人會成為你的核心", "tags": [], "notes": []}, {"id": 127, "start": 984.0, "end": 991.0, "en": "Audience the ones who comment regularly watch your videos and support your growth beyond that exposure from react", "zh": "觀眾：常留言、常看、支持你成長。除此之外，react 曝光也", "tags": [], "notes": []}, {"id": 128, "start": 991.0, "end": 999.0, "en": "Content can also boost credibility when a well-known Creator reacts to your work it signals audience that you're someone", "zh": "能提升可信度：知名創作者反應你的作品，等於向觀眾示意你值得一看。", "tags": [], "notes": []}, {"id": 129, "start": 999.0, "end": 1007.0, "en": "Worth checking out in my case having Asen gold react to my videos helped give me credibility as a voice in the gaming", "zh": "以我來說，Asmongold 反應我的影片，幫我在遊戲領域建立了發言可信度。", "tags": [], "notes": []}, {"id": 130, "start": 1007.0, "end": 1014.0, "en": "Space I'm going to be honest like this guy he's really cooking with this video I actually think this is probably the one of the best dissections of like the", "zh": "老實說這傢伙這支片真的在輸出；我覺得這大概是我看過對「這些事情在遊戲裡為什麼發生」最好的拆解之一。", "tags": [], "notes": []}, {"id": 131, "start": 1014.0, "end": 1021.0, "en": "Philosophy behind why these things happen in games that like I've seen this is good it's also one of the reasons why", "zh": "這很好。這也是為什麼並非所有 react 內容都等價；我覺得也是很多人看我影片的原因——我用正面的方式談，", "tags": [], "notes": []}, {"id": 132, "start": 1021.0, "end": 1029.0, "en": "All react content isn't created equal and I think also that's why a lot of people watch my videos it's because I talk about it in a way that's positive", "zh": "也會主動找我認為有幫助的影片。我通常不太「恨意觀看」很多影片；當然有時會，", "tags": [], "notes": []}, {"id": 133, "start": 1029.0, "end": 1038.0, "en": "And I also try to actively look for videos that I think will be beneficial like I generally don't hate watch a lot of videos now obviously I do sometimes", "zh": "但平常不會。你有沒有為了錢做過？我有沒有為了錢去反應一支 YouTube 影片？技術上答案是", "tags": [], "notes": []}, {"id": 134, "start": 1038.0, "end": 1046.0, "en": "But uh you know regularly no have you done it for money have I ever reacted to a YouTube video for money so the answer", "zh": "但平常不會。你有沒有為了錢做過？我有沒有為了錢去反應一支 YouTube 影片？技術上答案是", "tags": [], "notes": []}, {"id": 135, "start": 1046.0, "end": 1051.0, "en": "To that is a technical yes because uh I've been paid in a sponsorship to react", "zh": "技術上答案是有，因為我曾在贊助案裡被付錢去反應", "tags": [], "notes": []}, {"id": 136, "start": 1051.0, "end": 1056.0, "en": "To a trailer of a game and that was part of the sponsorship but you're asking has", "zh": "一款遊戲的預告片，那是贊助的一部分；但你問的是：有沒有", "tags": [], "notes": []}, {"id": 137, "start": 1056.0, "end": 1063.0, "en": "Another YouTuber paid me money to watch their video the answer to that question would be no and has opened doors to", "zh": "其他 YouTuber 付錢要我看他們的影片？答案是沒有。而這也打開了", "tags": [], "notes": []}, {"id": 138, "start": 1063.0, "end": 1074.0, "en": "Collaboration technically sponsors and other opportunities that wouldn't have otherwise been possible I also think that a potential fix would be a system where YouTube splits revenue from react", "zh": "合作、技術上還有贊助與其他原本不可能的機會。我也覺得一個可能解法是系統：讓 YouTube 從 react", "tags": [], "notes": []}, {"id": 139, "start": 1074.0, "end": 1088.0, "en": "Channels creating a more collaborative platform but this is just wishful thinking just a quick side note on this I've recently been seeing people say that Asma Gold's React videos are just him nodding or agreeing or raising his", "zh": "頻道分潤，創造更協作的平台——不過這只是一廂情願。順便一提：我最近常看到人說 Asmongold 的反應片只是他一直點頭、同意或挑", "tags": [], "notes": []}, {"id": 140, "start": 1088.0, "end": 1096.0, "en": "Eyebrows the whole time asman go gets involved that's right the guy that will play a YouTube video in its entirety occasionally raises eyebrows and says", "zh": "眉。Asmongold 會介入——對，就是那個會把整支 YouTube 影片完整播完、偶爾挑眉、然後一直說", "tags": [], "notes": []}, {"id": 141, "start": 1096.0, "end": 1104.0, "en": "The word sure a lot like the person true anyone who actually takes a few minutes to look into this would see that this is just not true just look at my video side", "zh": "「sure」很多的人。誰真的花幾分鐘查一下就會發現這根本不真。把我的影片跟他的反應並排看，", "tags": [], "notes": []}, {"id": 142, "start": 1104.0, "end": 1109.0, "en": "By side the reactions he made on them he clearly adds a lot to the conversations", "zh": "他做的那些反應，明顯大幅加入了對話。", "tags": [], "notes": []}, {"id": 143, "start": 1109.0, "end": 1119.0, "en": "Now beyond the react content arguments going back to savor 3.0 video he then tries to go deeper into the premise that asmin gold is the most nihilistic person", "zh": "現在，在 react 內容論點之外，回到 Savior 3.0 的影片：他接著想更深主張 Asmongold 是他見過最虛無主義的人。", "tags": [], "notes": []}, {"id": 144, "start": 1119.0, "end": 1127.0, "en": "He has ever seen he doesn't well that's partially true he doesn't hold much moral values he seems to basically", "zh": "他並不……嗯那算部分對。他沒抱持多少道德價值，似乎會", "tags": [], "notes": []}, {"id": 145, "start": 1127.0, "end": 1134.0, "en": "Flip-flop between any type of argument which basically benefits him to his audience he doesn't yeah well that is a", "zh": "在任何對他觀眾有利的論點之間反覆橫跳。他沒有……對，嗯，", "tags": [], "notes": []}, {"id": 146, "start": 1134.0, "end": 1145.0, "en": "Moral value is this good for me or not good for me it's good for me okay then I like it it's bad for me okay I don't like it have any moral consistency it", "zh": "「這對我好不好」本身也是一種道德價值：對我好我就喜歡，對我不好我就不喜歡。看起來他沒有道德一致性。", "tags": [], "notes": []}, {"id": 147, "start": 1145.0, "end": 1154.0, "en": "Seems like from a lot of his advice and a lot of the stuff that he talks about it seems asmin gold views values as baseless and he doesn't hold religion or", "zh": "從他很多建議與談論的內容看，Asmongold 似乎把價值觀當成沒有根基，也不太把宗教或", "tags": [], "notes": []}, {"id": 148, "start": 1154.0, "end": 1163.0, "en": "Morality with much regard true he might sometimes communicate the usefulness in the individual and society and", "zh": "道德當一回事——這點算真。他有時會談到對個人與社會有用、", "tags": [], "notes": []}, {"id": 149, "start": 1163.0, "end": 1170.0, "en": "Benefiting society and all that stuff but it seems like most of his arguments because he is literally living", "zh": "造福社會之類；但他多數論點看起來……因為他簡直活在", "tags": [], "notes": []}, {"id": 150, "start": 1170.0, "end": 1179.0, "en": "In a tiny little Echo chamber of basically a redditor addicted gamer who somehow got famous there's almost", "zh": "一個小小的回音室裡：基本上是個沉迷遊戲的 Reddit 用戶，不知怎麼紅了。幾乎", "tags": [{"k": "vocab", "v": "echo chamber", "native": "used when describing spaces that only reinforce what you already believe", "nativeZh": "形容只聽到同類意見的圈 ch a good Stak one of the best Stakes I've made probably in my top 100", "zh": "一塊超棒的牛排，我記得吃那塊牛排，真的好吃，大概能進我做過的前一百名", "tags": [], "notes": []}, {"id": 157, "start": 1226.0, "end": 1237.0, "en": "Best Stakes now to probably what he is saying yes as mold has definitely shared some nihilistic takes in the past but I wouldn't say he has fully embraced nihilism in its traditional sense for", "zh": "牛排。回到他大概想說的：對，Asmongold 過去確實分享過一些虛無主義論點，但我不會說他完全擁抱傳統意義上的虛無主義。", "tags": [], "notes": []}, {"id": 158, "start": 1237.0, "end": 1242.0, "en": "Those who aren't aware nihilism is defined as the rejection of all religious and moral principles in the", "zh": "不了解的人可以這樣定義：虛無主義是拒絕一切宗教與道德原則，並", "tags": [], "notes": []}, {"id": 159, "start": 1242.0, "end": 1255.0, "en": "Belief that life is meaningless yes as mold has shared his take on how he believes life is meaningless in the grand scheme of things I place like pretty much no value and like principles or morality I I think that these are top", "zh": "相信人生沒有意義。對，Asmongold 分享過他認為從宏觀看人生沒意義的想法。我幾乎不把原則或道德當一回事；我覺得那些是由上而下", "tags": [], "notes": []}, {"id": 160, "start": 1255.0, "end": 1264.0, "en": "Down ideas that are given to you by the elites and I think that if you look at most people that are in like a an advantageous position those people don't", "zh": "由精英灌給你的觀念；而且你看多數處於優勢位置的人，那些人根本", "tags": [], "notes": []}, {"id": 161, "start": 1264.0, "end": 1270.0, "en": "Follow any of those morals or ideals at all but at the same time it also seems to balance I learned that uh my dad", "zh": "不遵守那些道德或理想。但同時似乎也有平衡。我學到……我爸", "tags": [], "notes": []}, {"id": 162, "start": 1270.0, "end": 1276.0, "en": "Taught me that the first time that I went to Blazer laser tag my dad he", "zh": "第一次帶我去 Blazer 雷射槍戰時教我的：我爸", "tags": [], "notes": []}, {"id": 163, "start": 1276.0, "end": 1283.0, "en": "Pointed at the rules on the on the wall and I was like he says you look at that I'm like yep I see it he says that's", "zh": "指著牆上的規則，說你看那個——我說嗯我看到了——他說那就是", "tags": [], "notes": []}, {"id": 164, "start": 1283.0, "end": 1292.0, "en": "What you have to do to win and the thing is that I won I did immediately it wasn't even close", "zh": "你要贏必須做的。結果我立刻贏了，根本不是對手。", "tags": [], "notes": []}, {"id": 165, "start": 1292.0, "end": 1300.0, "en": "Arguing that if life has no built- in meaning we can still create our own because it's not like an aimless life I", "zh": "論點是：即使人生沒有內建意義，我們仍可創造自己的意義，因為那並非漫無目的的人生。我", "tags": [], "notes": []}, {"id": 166, "start": 1300.0, "end": 1308.0, "en": "Do what I want to do so you have goals I do have some goals yeah I have things that I want to do right but he by no means has ever encouraged or preached at", "zh": "做我想做的事。所以你有目標？對，我有一些目標，有想做的事。但他絕沒有鼓勵或宣揚", "tags": [], "notes": []}, {"id": 167, "start": 1308.0, "end": 1318.0, "en": "His audience to have the same mindset that he has himself it's weird that people say that I'm like super nihilistic in that way because like I'm actually one of the like I I do stuff", "zh": "觀眾要跟他同一個心態。很怪大家說我超虛無，因為我其實是那種一直在", "tags": [], "notes": []}, {"id": 168, "start": 1318.0, "end": 1327.0, "en": "All the time like I'm always being active like yesterday as I said I didn't do [ __ ] anything right but it was like that was a super super rare day uh", "zh": "做事、總是很活躍的人。昨天我是說我什麼都沒幹，但那是超罕見的一天；", "tags": [], "notes": []}, {"id": 169, "start": 1327.0, "end": 1337.0, "en": "For the most part I always am am being active I'm always doing things I'm always working at something I'm always being you know involved with something", "zh": "多數時候我總在活動、總在做事、總在推進什麼、總在參與什麼。", "tags": [], "notes": []}, {"id": 170, "start": 1337.0, "end": 1344.0, "en": "Uh everything my my for my whole life nobody should watch My Stream and say I want to be like this this animal listen", "zh": "我這輩子……不該有人看我的實況然後說「我想變成這隻動物」。聽著，", "tags": [], "notes": []}, {"id": 171, "start": 1344.0, "end": 1355.0, "en": "I don't think anybody with a successful life should want to be like me and I really mean that I I I genuinely mean that you don't want to live the way that I live the way that I live is not", "zh": "我不覺得任何人生成功的人會想跟我一樣；我是認真的。你不會想過我過的那種生活：那不是", "tags": [], "notes": []}, {"id": 172, "start": 1355.0, "end": 1367.0, "en": "Some sort of enlightened in Buddhist Nirvana it is absolute pure degeneracy there's this natural tendency that we have as humans that's right I've said this many times nobody wants to be what I am yeah it feels like you're super", "zh": "什麼開悟的佛教涅槃，那是絕對純粹的墮落。我們作為人類有這種自然傾向——對，我說過很多次：沒人想變成我這樣。對，感覺你超", "tags": [], "notes": []}, {"id": 173, "start": 1367.0, "end": 1378.0, "en": "Nihilistic but at the same time you're not the presence of nihilism does not precipitate the absence of a degree of", "zh": "虛無，但同時你又不是。虛無主義的存在，並不必然導致完全沒有某種程度的", "tags": [], "notes": []}, {"id": 174, "start": 1378.0, "end": 1388.0, "en": "Uh optimism I think that the idea that there's no Divine ordering of the world can be replaced with the opportunity of", "zh": "樂觀。我覺得「世界沒有神聖秩序」這個想法，可以被「用你認為合適的方式去", "tags": [], "notes": []}, {"id": 175, "start": 1388.0, "end": 1395.0, "en": "Ordering it in a way that you see uh fit and I think the enthusiasm for that can", "zh": "排序世界」的機會取代；而對那件事的熱情，可以", "tags": [], "notes": []}, {"id": 176, "start": 1395.0, "end": 1402.0, "en": "Replace what people can consider religion or something like that and this has been a very this very very commonly", "zh": "取代人們所謂的宗教之類的東西。這其實是個被談得非常非常多的", "tags": [], "notes": []}, {"id": 177, "start": 1402.0, "end": 1409.0, "en": "Talked about uh you know like philosophical idea to automatically put up a guard against belever or World", "zh": "哲學觀念。我們會自動對完全陌生、或與自己信念相反的世界觀豎起防線。", "tags": [], "notes": []}, {"id": 178, "start": 1409.0, "end": 1418.0, "en": "Views that are either completely unfamiliar to us or contrary to what we ourselves believe not everyone is like this but a lot of us are like this nihilism is easy to correlate with", "zh": "不是每個人都這樣，但很多人是。虛無主義很容易被聯想到", "tags": [], "notes": []}, {"id": 179, "start": 1418.0, "end": 1431.0, "en": "Historical or fictional figures who have had a negative impact on their society some of us might have even experience personal grief from people with similar World Views but this in no way gives ground for automatic hate nor does it", "zh": "對社會有負面影響的歷史或虛構人物；有些人甚至曾被持相似世界觀的人傷害過。但這絕不構成自動仇恨的理由，也不構成", "tags": [], "notes": []}, {"id": 180, "start": 1431.0, "end": 1438.0, "en": "Give justification for spreading lies now I do want to ask please do not go onto savior's channel to harass him or", "zh": "散播謊言的正當化。現在我要拜託：請不要去 Savior 的頻道騷擾他或", "tags": [], "notes": []}, {"id": 181, "start": 1438.0, "end": 1446.0, "en": "Attack him he's genuinely trying to convey a message he deeply believes in and I would say good for him for doing that we can simply disagree and move on", "zh": "攻擊他。他真心想傳達他深信的訊息，我覺得他這樣做很好。我們可以單純不同意，然後繼續走。 （對應：we can simply disagree and move on）", "tags": [{"k": "phrase", "v": "Disagreement is not the same as hate.", "native": "used when pushing back on people who treat criticism as hostility", "nativeZh": "反駁把批評當成仇恨"}], "notes": []}, {"id": 182, "start": 1446.0, "end": 1452.0, "en": "As Aristotle once wrote it is a mark of an educated mind to be able to entertain a thought without accepting see this", "zh": "正如亞里斯多德所寫：有教養的心靈標誌，是能夠思索一個想法卻不必採納它。你看這裡——", "tags": [{"k": "phrase", "v": "It is a mark of an educated mind to entertain a thought without accepting it.", "native": "used when praising open-minded thinking without instant agreement", "nativeZh": "稱讚能思考卻不必立刻接受"}, {"k": "vocab", "v": "entertain a thought", "native": "used when considering an idea carefully without agreeing yet", "nativeZh": "認真考慮想法但尚未同意"}], "notes": [{"label": "單字：entertain a thought", "ex": ["Just entertain the thought for a minute."], "use": "暫時認真考慮某個想法，不代表採納；批判思考關鍵動詞。", "native": "used when considering an idea carefully without agreeing yet", "nativeZh": "認真考慮想法但尚未同意"}]}, {"id": 183, "start": 1452.0, "end": 1458.0, "en": "Right here you hear this this is that you can't do that anymore you can't do", "zh": "你聽到了嗎？這種事你現在不能再做了，你不能再", "tags": [], "notes": []}, {"id": 184, "start": 1458.0, "end": 1470.0, "en": "See this we're way past this we already had the foundation for this for this [ __ ] 2,000 years ago 3,000 years ago some [ __ ] right but but for some reason", "zh": "這樣——你看，我們早就過了這個階段。兩千年前、三千年前就已經有這個基礎了，什麼鬼；但不知為何", "tags": [], "notes": []}, {"id": 185, "start": 1470.0, "end": 1475.0, "en": "We got to go back to that censorship [ __ ] all the time all the [ __ ] time", "zh": "我們總是要一再回到那種審查的鬼東西，一天到晚、整天都是。", "tags": [], "notes": []}, {"id": 186, "start": 1475.0, "end": 1481.0, "en": "Brings me to my next point on why some people dislike asmin gold there's a strange tendency especially among those", "zh": "這把我帶到下一個點：為什麼有些人不喜歡 Asmongold。有一種奇怪的傾向，尤其是在那些", "tags": [], "notes": []}, {"id": 187, "start": 1481.0, "end": 1491.0, "en": "Chronically online to equate disagreeing with someone to hating them yeah that's [ __ ] true it's some pretty crazy unhinged stuff and he doesn't back down", "zh": "長期泡在網上的人當中：把「不同意某人」等同於「仇恨某人」。對，這他媽是真的。相當瘋狂失控的事，而他也不退讓； （對應：equate disagreeing with someone to hating them）", "tags": [{"k": "phrase", "v": "Disagreement is not the same as hate.", "native": "used when pushing back on people who treat criticism as hostility", "nativeZh": "反駁把批評當成仇恨"}, {"k": "vocab", "v": "chronically online", "native": "describing people whose opinions are shaped by living on the internet", "nativeZh": "形容觀點被網路生活形塑的人"}], "notes": [{"label": "單字：chronically online", "ex": ["That take feels chronically online."], "use": "網路俚語，形容長期泡在網路上、世界觀被網路文化嚴重形塑的人。", "native": "describing people whose opinions are shaped by living on the internet", "nativeZh": "形容觀點被網路生活形塑的人"}]}, {"id": 188, "start": 1491.0, "end": 1498.0, "en": "And we all know people don't like it when others are like this America deserve 911 dude it I'm saying it", "zh": "我們都知道人們不喜歡別人這樣。美國活該 911……我是在舉例。", "tags": [], "notes": []}, {"id": 189, "start": 1498.0, "end": 1504.0, "e , "end": 1556.0, "en": "This is it's so funny to see these people crying about this I'm going to give you guys a little bit of a hint a lot of companies now are already using", "zh": "太好笑了看這些人哭這個。我給你們一點提示：現在很多公司已經在用", "tags": [], "notes": []}, {"id": 197, "start": 1556.0, "end": 1567.0, "en": "AI art and they're just not telling you I've gone around many twitch and YouTube channels throughout the last year and I find it fascinating how most channels are easily seen as many Echo Chambers", "zh": "AI 藝術，只是不告訴你。過去一年我跑了很多 Twitch 與 YouTube 頻道，我發現大多數頻道很容易被看成很多回音室；", "tags": [{"k": "vocab", "v": "echo chamber", "native": "used when describing spaces that only reinforce what you already believe", "nativeZh": "形容只聽到同類意見的圈子"}], "notes": [{"label": "單字：echo chamber", "ex": ["Social media can become an echo chamber."], "use": "回音室：只聽到相似觀點、強化既有信念的環境。", "native": "used when describing spaces that only reinforce what you already believe", "nativeZh": "形容只聽到同類意見的圈子"}]}, {"id": 198, "start": 1567.0, "end": 1576.0, "en": "But I can also see how those who don't actually watch asmin gold can point fingers at his channel and say the same thing but I've actually never seen a content creator who sides against his", "zh": "但我也理解那些沒真正看過 Asmongold 的人，會用手指他的頻道說同樣的話。不過我幾乎沒見過哪個創作者像 Asmongold 這樣，經常在直播裡站到", "tags": [], "notes": []}, {"id": 199, "start": 1576.0, "end": 1584.0, "en": "Entire audience live as much as asman gold does I really do that a lot don't I people get mad the man has even riled me", "zh": "整個觀眾的對立面。我真的很常這樣，對吧？大家會生氣。這個人有時連我都會被他某些立場惹毛，", "tags": [], "notes": []}, {"id": 200, "start": 1584.0, "end": 1592.0, "en": "Up at times with some of his takes like the fact that Halo infinite didn't launch with an official Battle Royale mode is unforgivable but I believe this", "zh": "像是 Halo Infinite 上市沒有正式大逃殺模式就不可原諒——但我相信這", "tags": [], "notes": []}, {"id": 201, "start": 1592.0, "end": 1605.0, "en": "Is actually healthy and I'll hey hey 343 Studios if at first you don't succeed well you ke er try to walk back statements that were a little bit too extreme and they don't", "zh": "在很多情況下也不追究社群與——你怎麼說——實況裡惡意行為者的責任。例如大家看那段納粹片段，而大家", "tags": [], "notes": []}, {"id": 256, "start": 2051.0, "end": 2063.0, "en": "Hold Bad actors in their community and in their uh what do you call it in their streams accountable in a lot of cases and like for example like people look at that that Nazi clip and what people", "zh": "在很多情況下追究社群與實況裡惡意行為者的責任。例如大家看那段納粹片段，而大家", "tags": [{"k": "vocab", "v": "bad actor", "native": "used when naming people who deliberately harm or manipulate a community", "nativeZh": "指故意傷害／操弄社群的人"}, {"k": "vocab", "v": "hold accountable", "native": "used when insisting someone face consequences for what they did", "nativeZh": "要求某人為行為承擔後果"}], "notes": [{"label": "單字：bad actor", "ex": ["Most creators are fine; a few bad actors ruin the reputation."], "use": "追究責任、要求負責；新聞與社群治理用語。", "native": "used when naming people who deliberately harm or manipulate a community", "nativeZh": "指故意傷害／操弄社群的人"}]}, {"id": 257, "start": 2063.0, "end": 2070.0, "en": "Didn't see about that is like all the people saying W nais is that all the those people were banned immediately and", "zh": "沒看到的是：所有說「W Nazis」之類的人立刻都被 ban 了，", "tags": [], "notes": []}, {"id": 258, "start": 2070.0, "end": 2078.0, "en": "Even my chat and mods reported them and banned all of them and we got their accounts banned even so the the entire", "zh": "甚至我的聊天室與管理員檢舉並 ban 了他們，還讓那些帳號被 ban。所以整件事的", "tags": [], "notes": []}, {"id": 259, "start": 2078.0, "end": 2085.0, "en": "Premise of that was completely fake one of my favorite words in the world is the word accountable humans are extremely", "zh": "前提完全是假的。我最喜歡的詞之一就是 accountable（可被究責）。人類極度（對應 accountable）", "tags": [{"k": "vocab", "v": "hold accountable", "native": "used when insisting someone face consequences for what they did", "nativeZh": "要求某人為行為承擔後果"}], "notes": []}, {"id": 260, "start": 2085.0, "end": 2091.0, "en": "Fallible and we can have some pretty terrible blind spots in our lives so any content creator that advocates for", "zh": "容易犯錯，生活中也可能有相當可怕的盲點；所以任何倡導", "tags": [{"k": "vocab", "v": "fallible", "native": "used when reminding people (including experts) that they can be wrong", "nativeZh": "提醒人（含專家）都會犯錯"}], "notes": [{"label": "單字：fallible", "ex": ["Everyone is fallible—own your mistakes."], "use": "會犯錯的、不完美的；談謙遜與問責時常用。", "native": "used when reminding people (including experts) that they can be wrong", "nativeZh": "提醒人（含專家）都會犯錯"}]}, {"id": 261, "start": 2091.0, "end": 2100.0, "en": "Accountability is a content creator that I believe is worth following I don't believe this controversy makes asman gold a racist it actually just reaffirms", "zh": "問責的創作者，我都覺得值得追隨。我不認為這場爭議讓 Asmongold 變成種族主義者；它其實更再確認", "tags": [], "notes": []}, {"id": 262, "start": 2100.0, "end": 2108.0, "en": "Asman gold as being a genuine fallible dude who can own his faults and advocate for bettering himself like asman gold is", "zh": "Asmongold 是個真誠、會犯錯、能承認缺點並主張自我改進的人。像 Asmongold，", "tags": [{"k": "vocab", "v": "fallible", "native": "used when reminding people (including experts) that they can be wrong", "nativeZh": "提醒人（含專家）都會犯錯"}], "notes": [{"label": "單字：fallible", "ex": ["Everyone is fallible—own your mistakes."], "use": "會犯錯的、不完美的；談謙遜與問責時常用。", "native": "used when reminding people (including experts) that they can be wrong", "nativeZh": "提醒人（含專家）都會犯錯"}]}, {"id": 263, "start": 2108.0, "end": 2115.0, "en": "He tends to play Devil's Advocates against himself asman gold has this beautiful ability at times to approach", "zh": "他常常對自己唱反調／當魔鬼代言人。Asmongold 有時有種很美的能力：能以善意處理", "tags": [{"k": "vocab", "v": "play devil's advocate", "native": "used when arguing the opposite side on purpose to stress-test an idea", "nativeZh": "故意辯護反方來壓力測試論點"}], "notes": [{"label": "單字：play devil's advocate", "ex": ["Let me play devil's advocate for a second."], "use": "故意站在反對立場提問，用來檢驗論點是否站得住腳。", "native": "used when arguing the opposite side on purpose to stress-test an idea", "nativeZh": "故意辯護反方來壓力測試論點"}]}, {"id": 264, "start": 2115.0, "end": 2123.0, "en": "Controversial subjects in good faith it's something I've noticed about him over the years and it's definitely a quality I hope he never loses he doesn't", "zh": "爭議話題。這是我這些年注意到的特質，也絕對希望他別失去。他不", "tags": [{"k": "vocab", "v": "in good faith", "native": "used when stressing honest intent in a debate, not trapping the other side", "nativeZh": "強調辯論出於誠意、不是設套"}], "notes": [{"label": "單字：in good faith", "ex": ["I'm arguing in good faith—please don't twist my words."], "use": "出於善意／真誠地討論或行動，不是故意找碴或抹黑。", "native": "used when stressing honest intent in a debate, not trapping the other side", "nativeZh": "強調辯論出於誠意、不是設套"}]}, {"id": 265, "start": 2123.0, "end": 2129.0, "en": "Always do this but when he does I find myself personally challenged this has naturally encouraged his audience", "zh": "總是這樣做；但當他這樣做時，我會覺得自己被挑戰。這自然也鼓勵了他的觀眾——", "tags": [], "notes": []}, {"id": 266, "start": 2129.0, "end": 2138.0, "en": "Including me to have a slightly broader perspective when looking into controversial topics where people usually have an established bias take", "zh": "包括我——在看待通常已有既定偏見的爭議話題時，視角稍微更寬一點。例如", "tags": [], "notes": []}, {"id": 267, "start": 2138.0, "end": 2146.0, "en": "For instance a post on X last year from Kelly Lombardi a global games product marketing manager at Xbox given how", "zh": "去年 X 上 Kelly Lombardi（Xbox 全球遊戲產品行銷經理）的一則貼文。鑒於近年", "tags": [], "notes": []}, {"id": 268, "start": 2146.0, "end": 2154.0, "en": "Polarizing the gaming industry has become in recent years it would be easy to look at her post and label her as an anti-white liberal elitist and move on", "zh": "遊戲產業有多兩極化，很容易看了她的貼文就把她標成反白人的自由派精英，然後了事。", "tags": [], "notes": []}, {"id": 269, "start": 2154.0, "end": 2161.0, "en": "If anyone had the prerogative to lean into that narrative it would be asman gold but instead asman gold challenged", "zh": "若有誰有資格順勢踩進那個敘事，會是 Asmongold；但 Asmongold 反而挑戰了", "tags": [], "notes": []}, {"id": 270, "start": 2161.0, "end": 2170.0, "en": "His audience and himself by sharing how he viewed kayy's post from her perspective am I the person that's going to have to have the hot take that this isn't really that big of a deal and I", "zh": "他的觀眾與他自己，分享他如何從 Kelly 的視角看那則貼文。我是不是那個得放「這其實沒那麼嚴重、我也不", "tags": [], "notes": []}, {"id": 271, "start": 2170.0, "end": 2181.0, "en": "Don't really find this to be inherently racist the problem is that when when you're a hammer every problem looks like a nail and I don't think this one's a nail guys I don't like I don't think", "zh": "覺得這本質上種族歧視」這種燙手觀點的人？問題是：當你是錘子，每個問題都像釘子；我不覺得這個是釘子，各位。我不覺得", "tags": [], "notes": []}, {"id": 272, "start": 2181.0, "end": 2187.0, "en": "That this is advocating for like any sort of exclusion I don't think it's advocating for degradation I don't think", "zh": "這是在主張任何排除，不覺得是在主張貶低，也不覺得", "tags": [], "notes": []}, {"id": 273, "start": 2187.0, "end": 2191.0, "en": "This one is that big of a deal am I crazy and I get how you could perceive", "zh": "這件事有那麼嚴重。我瘋了嗎？我也理解你怎麼會把它", "tags": [], "notes": []}, {"id": 274, "start": 2191.0, "end": 2199.0, "en": "This as being bad I do and like I I got Fe I got a push back because I didn't get mad about Kingdom Come Deliverance", "zh": "看成壞事，我真的懂；而且我因為沒對《天國降臨：救贖》發怒而被推回來，", "tags": [], "notes": []}, {"id": 275, "start": 2199.0, "end": 2206.0, "en": "Either and I also got push back because I didn't automatically categorize south of midnight as a Dei game either even", "zh": "也因為沒自動把《South of Midnight》歸類成 DEI 遊戲而被推回來——即使", "tags": [], "notes": []}, {"id": 276, "start": 2206.0, "end": 2215.0, "en": "Though it had a black female protagonist uh so i' I've had a number of elements and then AOW is another minor example as well I try to interpret", "zh": "它有黑人女性主角。所以我遇過不少這種情形；AOW 也是另一個小例子。我試著用善意", "tags": [], "notes": []}, {"id": 277, "start": 2215.0, "end": 2222.0, "en": "Things in good faith seeing him do this really struck me at the time and it pushed me to rethink my own assumptions", "zh": "解讀事情。當時看他這樣做真的震撼到我，也逼我重新思考自己的預設。 （對應 rethink my own assumptions）", "tags": [{"k": "phrase", "v": "Challenge your own assumptions.", "native": "used when urging a self-check before arguing harder", "nativeZh": "辯論前先自我檢查預設"}, {"k": "vocab", "v": "in good faith", "native": "used when stressing honest intent in a debate, not trapping the other side", "nativeZh": "強調辯論出於誠意、不是設套"}], "notes": [{"label": "單字：in good faith", "ex": ["I'm arguing in good faith—please don't twist my words."], "use": "出於善意／真誠地討論或行動，不是故意找碴或抹黑。", "native": "used when stressing honest intent in a debate, not trapping the other side", "nativeZh": "強調辯論出於誠意、不是設套"}]}, {"id": 278, "start": 2222.0, "end": 2231.0, "en": "It even bettered me as a man in how I approach things critically cuz my original approach to this post was anything but graceful like I said asmin", "zh": "它甚至讓我在批判性處理事情的方式上變得更好，因為我原本對那則貼文的反應一點也不優雅。就像我說的，Asmongold", "tags": [], "notes": []}, {"id": 279, "start": 2231.0, "end": 2238.0, "en": "Gold doesn't always do this but he does do this and it always gets his audience either thinking or actually annoyed", "zh": "不總是這樣做，但他確實會；而且總會讓觀眾要嘛開始思考、要嘛真的很煩。", "tags": [], "notes": []}, {"id": 280, "start": 2238.0, "end": 2244.0, "en": "Another great trait that I believe asmin gold has that I personally like is that he stands behind what he believes", "zh": "另一個我個人喜歡、也覺得 Asmongold 很棒的特質是：他站在自己所相信的背後。", "tags": [], "notes": []}, {"id": 281, "start": 2244.0, "end": 2251.0, "en": "Although I sometimes disagree with asmin gold approach to tackling some of these issues I really appreciate how he", "zh": "雖然我有時不同意 Asmongold 處理某些議題的方式，我真的很欣賞他", "tags": [], "notes": []}, {"id": 282, "start": 2251.0, "end": 2257.0, "en": "Doesn't back down from what he believes in regardless of how unpopular his opinion is even live remember that", "zh": "無論意見多不受歡迎，都不從信念退縮——甚至在直播裡。還記得那個", "tags": [], "notes": []}, {"id": 283, "start": 2257.0, "end": 2263.0, "en": "OverWatch thing about how I was defending OverWatch 2 because they didn't have loot boxes maybe it's pure", "zh": "Overwatch 的事：我因為他們沒有寶箱而替 Overwatch 2 辯護。也許這純粹是", "tags": [], "notes": []}, {"id": 284, "start": 2263.0, "end": 2271.0, "en": "Stubbornness but I think it's good because it gets his audience thinking something for me that shows either really good character or a complete lack", "zh": "固執，但我覺得這很好，因為它讓觀眾開始思考。對我來說，這顯示的要嘛是很好的品格，要嘛是完全", "tags": [], "notes": []}, {"id": 285, "start": 2271.0, "end": 2280.0, "en": "Of caring is that despite immense wealth and fame asmin gold doesn't change got not really going to talk about the subject too much because it I don't", "zh": "不在乎：儘管擁有巨大財富與名氣，Asmongold 沒有改變。我不太想多談這個主題，因為我", "tags": [], "notes": []}, {"id": 286, "start": 2280.0, "end": 2286.0, "en": "Really like I mean the thing is that like I I don't know like I always viewed", "zh": "不太喜歡……重點是，我不知道，我總是把自己看成……", "tags": [], "notes": []}, {"id": 287, "start": 2286.0, "end": 2292.0, "en": "Myself like I don't it's just weird people want to change their life so much like I've always been happy like that's", "zh": "就是很怪，人們那麼想改變自己的人生；而我一直很開心，就這樣。", "tags": [], "notes": []}, {"id": 288, "start": 2292.0, "end": 2299.0, "en": "It I mean there's things about my life I'm not happy about but I'm there's PE there are people in the world that try to find what's bad with what's good", "zh": "我是說人生裡有些事我不滿意，但世界上有人總想在好東西裡找壞，", "tags": [], "notes": []}, {"id": 289, "start": 2299.0, "end": 2304.0, "en": "Inside of what's good and there are people that try to find what's good inside of what's bad and I feel like", "zh": "也有人想在壞東西裡找好。我覺得", "tags": [], "notes": []}, {"id": 290, "start": 2304.0, "end": 2311.0, "en": "Being around people that try to always find the bad in the good is one of the most exhausting emotional vampire things", "zh": "跟總是在好事裡找壞事的人在一起，是最耗神的情緒吸血鬼之一，", "tags": [], "notes": []}, {"id": 291, "start": 2311.0, "end": 2317.0, "en": "That you can ever deal with and I try very hard to not be like that and a function esc(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}
function fmt(sec) {
  sec = Math.max(0, sec || 0);
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m + ':' + String(s).padStart(2, '0');
}
function hasKind(seg, k) { return (seg.tags || []).some(t => t.k === k); }

function rebuildOrder() {
  order = [];
  for (let i = 0; i < SEGMENTS.length; i++) {
    const s = SEGMENTS[i];
    const tags = s.tags || [];
    if (filter === 'all') order.push(i);
    else if (filter === 'phrase' && hasKind(s, 'phrase')) order.push(i);
    else if (filter === 'vocab' && hasKind(s, 'vocab')) order.push(i);
    else if (filter === 'tagged' && tags.length) order.push(i);
  }
  if (!order.length) {
    statusEl.textContent = '此篩選沒有段落，已回到「全部」。';
    filter = 'all';
    document.querySelectorAll('#filterSeg button').forEach(b => {
      b.classList.toggle('active', b.dataset.filter === 'all');
    });
    rebuildOrder();
    return;
  }
  pos = Math.min(pos, order.length - 1);
}

function current() { return SEGMENTS[order[pos]]; }

function markerHtml(t) {
  const kind = t.k === 'vocab' ? 'vocab' : 'phrase';
  const label = kind === 'vocab' ? `【單字：${esc(t.v)}】` : `【學習句：${esc(t.v)}】`;
  const ex = (t.examples || []).map(e => `<li>${esc(e)}</li>`).join('');
  const usage = t.usage ? `<div class="usage">Usage：${esc(t.usage)}</div>` : '';
  const nativeLine = t.native
    ? `<div class="native-use"><strong>Native use / 母語情境</strong>：${esc(t.native)}${t.nativeZh ? '（' + esc(t.nativeZh) + '）' : ''}</div>`
    : '';
  return `<div class="marker ${kind}">
    <div class="label">${label}</div>
    ${ex ? `<ul class="examples">${ex}</ul>` : ''}
    ${usage}
    ${nativeLine}
  </div>`;
}

    <div class="label-zh">翻譯</div>
    <div class="zh">${esc(s.zh)}</div>
    ${pills ? `<div class="tags">${pills}</div>` : '<p class="note">此段暫無學習句／單字標記。</p>'}
    ${markers}
  `;
}

function hideContent() {
  revealed = false;
  spoiler.classList.add('locked');
  spoiler.classList.remove('open');
  revealedBody.innerHTML = '';
  btnHide.disabled = true;
  btnReveal.disabled = false;
}
function showContent() {
  revealed = true;
  revealedBody.innerHTML = buildRevealedHtml(current());
  spoiler.classList.remove('locked');
  spoiler.classList.add('open');
  btnHide.disabled = false;
  btnReveal.disabled = true;
}

function render() {
  const s = current();
  progressEl.textContent = (pos + 1) + ' / ' + order.length + (filter !== 'all' ? `（篩選 · 全庫 ${SEGMENTS.length}）` : '');
  numEl.textContent = String(s.id);
  timeEl.textContent = fmt(s.start) + ' – ' + fmt(s.end);
  const nPhrase = (s.tags || []).filter(t => t.k === 'phrase').length;
  const nVocab = (s.tags || []).filter(t => t.k === 'vocab').length;
  const bits = [];
  if (nPhrase) bits.push('學習句 ' + nPhrase);
  if (nVocab) bits.push('單字 ' + nVocab);
  tagHint.textContent = bits.length ? ('本段有 ' + bits.join(' · ')) : '本段無標記（仍有原文／翻譯）';
  hideContent();
  btnPrev.disabled = pos <= 0;
  btnNext.disabled = pos >= order.length - 1;
  if (!statusEl.textContent.includes('音訊')) statusEl.textContent = '';
  stopClip(false);
}

function resetPlayBtn() {
  btnPlay.disabled = false;
  btnPlay.textContent = '▶ 播放';
}
function stopClip(resetBtn = true) {
  playToken += 1;
  try { player.pause(); } catch (_) {}
  if (resetBtn) resetPlayBtn();
}
function onTick() {
  try {
    if (player.currentTime >= stopAtSec - 0.04) {
      const token = playToken;
      try { player.pause(); } catch (_) {}
      if (token === playToken) resetPlayBtn();
    }
  } catch (_) {}
}

async function playSeg() {
  const s = current();
  if (!audioReady) {
    statusEl.textContent = '音訊還在載入，請稍候再按播放。';
    return;
  }
  stopClip(false);
  const token = ++playToken;
  stopAtSec = s.end;
  btnPlay.disabled = true;
  btnPlay.textContent = '播放中…';
  const startPlay = () => {
    if (token !== playToken) return;
    const p = player.play();
    if (p && p.catch) p.catch(() => {
      statusEl.textContent = '無法自動播放，請先點一下頁面或音訊控件。';
      resetPlayBtn();
    });
  };
  try { player.currentTime = s.start; } catch (_) {}
  if (Math.abs((player.currentTime || 0) - s.start) > 0.35) {
    const onSeeked = () => {
      player.removeEventListener('seeked', onSeeked);
      startPlay();
    };
    player.addEventListener('seeked', onSeeked);
    try { player.currentTime = s.start; } catch (_) { startPlay(); }
  } else {
    startPlay();
  }
}

btnPlay.addEventListener('click', playSeg);
btnReplay.addEventListener('click', playSeg);
btnReveal.addEventListener('click', showContent);
btnHide.addEventListener('click', hideContent);
btnPrev.addEventListener('click', () => { if (pos > 0) { pos -= 1; render(); } });
btnNext.addEventListener('click', () => { if (pos < order.length - 1) { pos += 1; render(); } });
btnYoutube.addEventListener('click', () => {
  const s = current();
  const url = YT + (YT.includes('?') ? '&' : '?') + 't=' + Math.floor(s.start) + 's';
  window.open(url, '_blank', 'noopener');
});
document.querySelectorAll('#filterSeg button').forEach(btn => {
  btn.addEventListener('click', () => {
    filter = btn.dataset.filter;
    document.querySelectorAll('#filterSeg button').forEach(b => b.classList.toggle('active', b === btn));
    pos = 0;
    rebuildOrder();
    render();
  });
});
player.addEventListener('timeupdate', onTick);
player.addEventListener('ended', () => resetPlayBtn());

async function loadAudio() {
  for (const src of AUDIO_CANDIDATES) {
    try {
      await new Promise((resolve, reject) => {
        const onOk = () => { cleanup(); resolve(); };
        const onErr = () => { cleanup(); reject(new Error('fail')); };
        const cleanup = () => {
          player.removeEventListener('loadedmetadata', onOk);
          player.removeEventListener('canplay', onOk);
          player.removeEventListener('error', onErr);
        };
        player.addEventListener('loadedmetadata', onOk);
        player.addEventListener('canplay', onOk);
        player.addEventListener('error', onErr);
        player.src = src;
        player.load();
      });
      audioReady = true;
      statusEl.textContent = '音訊已就緒。';
      return;
    } catch (_) {}
  }
  statusEl.textContent = '音訊載入失敗：請檢查網路或稍後再試。';
}

rebuildOrder();
render();
loadAudio();
</script>
</body>
</html>
